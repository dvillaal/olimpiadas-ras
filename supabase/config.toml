# Configuración de la CLI de Supabase.
# Referencia: https://supabase.com/docs/guides/local-development/cli/config

project_id = "olimpiadas-scouts"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
# Permite que `supabase db push --include-seed` cargue países, ramas y deportes.
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://localhost:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# El registro público de cuentas está deshabilitado a propósito: las cuentas de
# los grupos las crea el administrador al aprobar la solicitud.
enable_signup = false
enable_manual_linking = false

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = false
secure_password_change = true
max_frequency = "1s"
otp_length = 6
otp_expiry = 3600

[storage]
enabled = true
# Debe ir alineado con settings.max_proof_mb.
file_size_limit = "8MiB"

[realtime]
enabled = true

[inbucket]
# Servidor de correo local para probar sin enviar nada real.
enabled = true
port = 54324
