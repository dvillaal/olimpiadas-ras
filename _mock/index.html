function canManageEvent(e){return session?.role==='admin'||session?.role==='referee'&&e.refereeId===session.id}
function openResultEntry(id){const e=scheduleById(id),s=sportById(e.sportId);if(!canManageEvent(e))return toast('Esta competencia no está asignada a tu usuario.','error');if(e.type==='match'){openModal(`<div class="modal-head"><h3>Registrar marcador</h3><button class="close" onclick="closeModal()">×</button></div><div class="scoreboard"><div><span>${esc(teamById(e.teamAId)?.name||'Equipo A')}</span><input id="scoreA" type="number" min="0" value="${e.result?.scoreA??0}"></div><b>VS</b><div><span>${esc(teamById(e.teamBId)?.name||'Equipo B')}</span><input id="scoreB" type="number" min="0" value="${e.result?.scoreB??0}"></div></div><div class="field"><label>Observaciones del árbitro</label><textarea id="resultNotes">${esc(e.result?.notes||'')}</textarea></div><div class="alert info">Puedes guardar un borrador y publicarlo después. Al publicar, cualquier persona podrá verlo sin iniciar sesión.</div><div class="actions"><button class="btn btn-secondary" onclick="saveMatchResult('${id}',false)">Guardar borrador</button><button class="btn btn-primary" onclick="saveMatchResult('${id}',true)">Publicar resultado</button></div>`);return}const entries=new Map((e.result?.entries||[]).map(x=>[x.participantId,x]));openModal(`<div class="modal-head"><h3>Registrar resultados de la sesión</h3><button class="close" onclick="closeModal()">×</button></div><div class="alert info"><b>${esc(s.name)}</b> · ${esc(s.resultLabel||'Resultado')} · gana el valor ${s.resultOrder==='asc'?'más bajo':'más alto'}.</div><div class="result-entry-list">${(e.participantIds||[]).map(id=>{const p=participantById(id),old=entries.get(id)||{};return`<div class="result-entry-row"><div><b>${esc(p?.name||'')}</b><small>${esc(groupById(p?.groupId)?.name||'')} · ${esc(branchName(p?.branch||''))}</small></div><input type="number" step="any" name="sessionResult" data-id="${id}" value="${old.value??''}" placeholder="${esc(s.resultLabel||'Resultado')}"><label><input type="checkbox" name="sessionDQ" data-id="${id}" ${old.disqualified?'checked':''}> DQ</label></div>`}).join('')}</div><div class="field"><label>Observaciones</label><textarea id="resultNotes">${esc(e.result?.notes||'')}</textarea></div><div class="actions"><button class="btn btn-secondary" onclick="saveSessionResult('${id}',false)">Guardar borrador</button><button class="btn btn-primary" onclick="saveSessionResult('${id}',true)">Publicar resultado</button></div>`)}
function saveMatchResult(id,publish){const e=scheduleById(id);e.result={scoreA:Number($('scoreA').value||0),scoreB:Number($('scoreB').value||0),notes:$('resultNotes').value.trim()};e.status=publish?'finished':'in_progress';e.resultPublished=publish;e.resultEnteredBy=session.name;e.resultUpdatedAt=new Date().toISOString();audit(`${publish?'Publicó':'Guardó'} resultado de ${scheduleTitle(e)}`);saveDB();closeModal();renderApp();toast(publish?'Resultado publicado.':'Borrador guardado.','success')}
function saveSessionResult(id,publish){const e=scheduleById(id),s=sportById(e.sportId),inputs=[...document.querySelectorAll('[name=sessionResult]')],entries=inputs.map(input=>{const dq=document.querySelector(`[name=sessionDQ][data-id="${input.dataset.id}"]`)?.checked;return{participantId:input.dataset.id,value:input.value===''?'':Number(input.value),disqualified:!!dq,rank:null}});const ranked=entries.filter(x=>!x.disqualified&&x.value!=='').sort((a,b)=>s.resultOrder==='asc'?a.value-b.value:b.value-a.value);ranked.forEach((x,i)=>x.rank=i+1);e.result={entries,notes:$('resultNotes').value.trim()};e.status=publish?'finished':'in_progress';e.resultPublished=publish;e.resultEnteredBy=session.name;e.resultUpdatedAt=new Date().toISOString();audit(`${publish?'Publicó':'Guardó'} resultados de ${scheduleTitle(e)}`);saveDB();closeModal();renderApp();toast(publish?'Resultados publicados.':'Borrador guardado.','success')}
function refereeDashboard(){const mine=db.schedules.filter(e=>e.refereeId===session.id),today=new Date().toISOString().slice(0,10),next=[...mine].filter(e=>competitionDate(e)>=new Date()).sort((a,b)=>competitionDate(a)-competitionDate(b))[0];setPage(`<div class="page-head"><div><h2>Hola, ${esc(session.name)}</h2><p>Aquí aparecen únicamente las competencias que te asignó la organización.</p></div></div><div class="cards">${stat('🗓️',mine.length,'Competencias asignadas')}${stat('☀️',mine.filter(e=>e.date===today).length,'Competencias de hoy')}${stat('✍️',mine.filter(e=>e.status!=='finished').length,'Resultados pendientes')}${stat('🏁',mine.filter(e=>e.resultPublished).length,'Resultados publicados')}</div>${next?`<div class="panel next-event"><span class="kicker">Próxima competencia</span><h2>${esc(sportById(next.sportId)?.name||'')}</h2><h3>${esc(scheduleTitle(next))}</h3><p>${fmtDate(next.date)} · ${esc(next.time)} · ${esc(next.venue||'Sin lugar')}</p><button class="btn btn-primary" onclick="openResultEntry('${next.id}')">Registrar resultado</button></div>`:'<div class="empty"><span class="big">🧑‍⚖️</span>No tienes competencias próximas.</div>'}<div class="panel"><h3>Cómo registrar un resultado</h3><div class="quick-steps"><button onclick="goPage('rassignments')"><b>1</b><span>Abre Mis competencias</span></button><button><b>2</b><span>Selecciona Registrar resultado</span></button><button><b>3</b><span>Guarda borrador o publica</span></button></div></div>`)}
function refereeAssignments(){const mine=[...db.schedules].filter(e=>e.refereeId===session.id).sort((a,b)=>competitionDate(a)-competitionDate(b));setPage(`<div class="page-head"><div><h2>Mis competencias</h2><p>Registra marcadores, tiempos, marcas o puntos y publícalos cuando estén verificados.</p></div><button class="btn btn-secondary" onclick="openPublicResults()">Ver portal público</button></div><div class="schedule-cards">${mine.length?mine.map(e=>`<div class="competition-card"><div class="competition-time"><b>${esc(e.time||'--:--')}</b><span>${fmtDate(e.date)}</span></div><div class="competition-main"><div class="sport-meta">${statusBadge(e.status)}${e.resultPublished?'<span class="badge green">Publicado</span>':''}</div><h3>${esc(sportById(e.sportId)?.name||'')}</h3><p><b>${esc(scheduleTitle(e))}</b></p><small>${esc(branchName(e.branchId))} · ${esc(e.venue||'Sin lugar')}</small></div><div><button class="btn btn-primary" onclick="openResultEntry('${e.id}')">${e.result?'Editar resultado':'Registrar resultado'}</button></div></div>`).join(''):'<div class="empty">No tienes competencias asignadas.</div>'}</div>`)}
function eventIncludesGroup(e,groupId){if(e.type==='match')return[teamById(e.teamAId),teamById(e.teamBId)].some(t=>(t?.ownerGroupId||t?.groupId)===groupId||(t?.members||[]).some(id=>participantById(id)?.groupId===groupId));return(e.participantIds||[]).some(id=>participantById(id)?.groupId===groupId)}
function groupSchedule(){const items=[...db.schedules].filter(e=>eventIncludesGroup(e,session.id)).sort((a,b)=>competitionDate(a)-competitionDate(b));setPage(`<div class="page-head"><div><h2>Mi programación</h2><p>Partidos y sesiones en los que participa tu grupo.</p></div><button class="btn btn-secondary" onclick="openPublicResults()">🏁 Resultados generales</button></div><div class="schedule-cards">${items.length?items.map(e=>`<div class="competition-card"><div class="competition-time"><b>${esc(e.time||'--:--')}</b><span>${fmtDate(e.date)}</span></div><div class="competition-main"><div class="sport-meta">${statusBadge(e.status)}${e.resultPublished?'<span class="badge green">Resultado publicado</span>':''}</div><h3>${esc(sportById(e.sportId)?.name||'')}</h3><p><b>${esc(scheduleTitle(e))}</b></p><small>${esc(branchName(e.branchId))} · ${esc(e.venue||'Sin lugar')} · Árbitro: ${esc(refereeById(e.refereeId)?.name||'Por asignar')}</small></div><div class="event-score">${eventResultSummary(e)}</div></div>`).join(''):'<div class="empty"><span class="big">🗓️</span>Aún no tienes competencias programadas.</div>'}</div>`)}
function groupDashboard(){const g=currentGroup(),ownTeams=db.teams.filter(t=>(t.ownerGroupId||t.groupId)===g.id),pendingPayments=db.payments.filter(p=>p.groupId===g.id&&p.status!=='approved').length,requests=db.intergroupRequests.filter(r=>(r.targetGroupId===g.id&&r.status==='pending')||(r.requesterGroupId===g.id&&r.status==='proposed')).length,next=db.schedules.filter(e=>eventIncludesGroup(e,g.id)&&competitionDate(e)>=new Date()).sort((a,b)=>competitionDate(a)-competitionDate(b))[0];setPage(`<div class="page-head"><div><h2>Hola, ${esc(g.name)}</h2><p>Completa la inscripción siguiendo los pasos en orden.</p></div></div>${!g.country?'<div class="alert warning"><b>Paso pendiente:</b> seleccionen el país que representarán.</div>':''}${requests?`<div class="alert info"><b>Tienen ${requests} solicitud(es) intergrupal(es) por atender.</b></div>`:''}<div class="quick-steps group-guide"><button onclick="goPage('gcountry')"><b>${g.country?'✓':'1'}</b><span>Escoger país</span></button><button onclick="goPage('gsports')"><b>2</b><span>Inscribir deportes</span></button><button onclick="goPage('grequests')"><b>3</b><span>Completar alianzas</span></button><button onclick="goPage('gpayments')"><b>4</b><span>Adjuntar pagos</span></button></div><div class="cards">${stat('🌍',g.country?flagOf(g.country):'—',g.country?countryName(g.country):'País pendiente')}${stat('👥',db.participants.filter(p=>p.groupId===g.id&&p.active).length,'Participantes activos')}${stat('🤝',ownTeams.length,'Equipos creados')}${stat('💳',pendingPayments,'Pagos pendientes')}</div>${next?`<div class="panel next-event"><span class="kicker">Próxima competencia</span><h3>${esc(sportById(next.sportId)?.name||'')} · ${esc(scheduleTitle(next))}</h3><p>${fmtDate(next.date)} · ${esc(next.time)} · ${esc(next.venue||'Sin lugar')}</p><button class="btn btn-secondary" onclick="goPage('gcalendar')">Ver programación</button></div>`:''}<div class="grid-2"><div class="panel"><h3>Avance de inscripción</h3>${groupProgress(g)}</div><div class="panel"><h3>Datos para pagar</h3>${bankCard()}</div></div>`)}
function teamHasExternal(t){return(t.members||[]).some(id=>participantById(id)?.groupId!==(t.ownerGroupId||t.groupId))}
function teamIntergroupApproved(t){const external=(t.members||[]).filter(id=>participantById(id)?.groupId!==(t.ownerGroupId||t.groupId));return external.every(id=>db.intergroupRequests.some(r=>r.teamId===t.id&&r.status==='admin_approved'&&(r.acceptedParticipantIds||[]).includes(id)))}
function teamReadyForPayment(t){const s=sportById(t.sportId);return t.members.length===s?.teamSize&&(!teamHasExternal(t)||teamIntergroupApproved(t))}
function teamGroupCard(t){const s=sportById(t.sportId),missing=Math.max(0,(s?.teamSize||0)-t.members.length),external=t.members.filter(id=>participantById(id)?.groupId!==session.id).length,fee=sportFee(s),approved=!external||teamIntergroupApproved(t),canPay=missing===0&&approved&&fee>0&&!t.paymentId&&t.status!=='confirmed',step=t.status==='confirmed'?4:t.paymentId?3:missing||!approved?2:3;return`<div class="sport-card"><div class="sport-icon">${esc(s?.icon||'🏅')}</div><h3>${esc(t.name)}</h3><p><b>${esc(s?.name||'')}</b></p><div class="mini-progress"><span class="${step>=1?'done':''}">Equipo</span><span class="${step>=2?'done':''}">Alianza</span><span class="${step>=3?'done':''}">Pago</span><span class="${step>=4?'done':''}">Confirmado</span></div><div class="sport-meta">${statusBadge(t.status)}<span class="badge blue">${t.members.length}/${s?.teamSize||0} titulares</span>${external?`<span class="badge orange">${external} externos</span>`:''}</div>${missing?`<div class="alert warning">Faltan <b>${missing}</b> integrante(s). Usa “Solicitar apoyo”.</div>`:''}${external&&!approved?'<div class="alert info">Los participantes externos están pendientes de aprobación administrativa.</div>':''}${t.adminNote?`<div class="alert danger">${esc(t.adminNote)}</div>`:''}<div class="actions"><button class="btn btn-sm btn-secondary" onclick="viewTeam('${t.id}')">Ver</button>${['draft','intergroup_review'].includes(t.status)?`<button class="btn btn-sm btn-secondary" onclick="openTeamForm('${t.sportId}','${t.id}')">Editar propios</button>`:''}${missing&&s?.allowIntergroup?`<button class="btn btn-sm btn-warning" onclick="openSupportRequest('${t.id}')">Solicitar apoyo</button>`:''}${canPay?`<button class="btn btn-sm btn-primary" onclick="prepareTeamPayment('${t.id}')">Pagar ${money(fee)}</button>`:''}${missing===0&&approved&&fee<=0&&t.status==='draft'?'<span class="badge red">Tarifa grupal pendiente</span>':''}</div></div>`}
function requestReceivedCard(r){const t=teamById(r.teamId),s=sportById(t?.sportId);return`<div class="participant-pick"><div style="flex:1"><b>${esc(t?.name||'Equipo')}</b><br><small>Solicita: ${esc(groupById(r.requesterGroupId)?.name||'')} · ${esc(s?.name||'')} · Necesitan ${r.count}</small>${r.message?`<br><small>Mensaje: ${esc(r.message)}</small>`:''}<br>${statusBadge(r.status)}${r.rejectionReason?`<br><small>${esc(r.rejectionReason)}</small>`:''}</div>${r.status==='pending'?`<div class="actions"><button class="btn btn-sm btn-primary" onclick="openProposeParticipants('${r.id}')">Proponer participantes</button><button class="btn btn-sm btn-danger" onclick="rejectIncomingRequest('${r.id}')">No puedo apoyar</button></div>`:''}${r.status==='proposed'?'<span class="badge blue">Esperando respuesta</span>':''}${['admin_review','admin_approved'].includes(r.status)?'<span class="badge green">Propuesta aceptada</span>':''}</div>`}
function requestSentCard(r){const names=(r.proposedParticipantIds||[]).map(id=>participantById(id)?.name).filter(Boolean).join(', ');return`<div class="participant-pick"><div style="flex:1"><b>${esc(teamById(r.teamId)?.name||'')}</b><br><small>Grupo aliado: ${esc(groupById(r.targetGroupId)?.name||'')} · ${r.count} solicitado(s)</small><br>${statusBadge(r.status)}${names?`<br><small>Propuestos: ${esc(names)}</small>`:''}${r.rejectionReason?`<br><small>Motivo: ${esc(r.rejectionReason)}</small>`:''}${r.adminNote?`<br><small>Administración: ${esc(r.adminNote)}</small>`:''}</div>${r.status==='proposed'?`<div class="actions"><button class="btn btn-sm btn-primary" onclick="acceptProposal('${r.id}')">Aceptar propuesta</button><button class="btn btn-sm btn-danger" onclick="rejectProposal('${r.id}')">Rechazar propuesta</button></div>`:''}${['pending','proposed'].includes(r.status)?`<button class="btn btn-sm btn-secondary" onclick="cancelSupportRequest('${r.id}')">Cancelar</button>`:''}</div>`}
function rejectIncomingRequest(id){const r=db.intergroupRequests.find(x=>x.id===id),reason=prompt('Cuéntale al grupo por qué no puedes apoyar esta solicitud:','')||'';if(!reason.trim())return toast('El motivo es obligatorio.','error');r.status='rejected';r.rejectionReason=reason.trim();r.respondedAt=new Date().toISOString();audit(currentGroup().name+' rechazó una solicitud de apoyo');saveDB();renderApp();toast('Solicitud rechazada.','success')}
function cancelSupportRequest(id){const r=db.intergroupRequests.find(x=>x.id===id);if(!confirm('¿Cancelar esta solicitud?'))return;r.status='cancelled';r.cancelledAt=new Date().toISOString();audit(currentGroup().name+' canceló una solicitud intergrupal');saveDB();renderApp()}
function acceptProposal(requestId){const r=db.intergroupRequests.find(x=>x.id===requestId),t=teamById(r.teamId),s=sportById(t.sportId),space=s.teamSize-t.members.length,ids=(r.proposedParticipantIds||[]).slice(0,space);if(!ids.length)return toast('No hay participantes propuestos.','error');const externalNow=t.members.filter(id=>participantById(id)?.groupId!==(t.ownerGroupId||t.groupId)).length;if(externalNow+ids.length>(s.maxExternal||0))return toast('La propuesta supera el máximo de integrantes externos.','error');t.members=[...new Set([...t.members,...ids])];r.status='admin_review';r.acceptedParticipantIds=ids;r.acceptedAt=new Date().toISOString();t.status='intergroup_review';audit(currentGroup().name+' aceptó apoyo de '+groupById(r.targetGroupId).name+' y lo envió a administración');saveDB();renderApp();toast('Propuesta aceptada. Administración debe aprobarla antes del pago.','success')}
function adminRequests(){const items=[...db.intergroupRequests].sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));setPage(`<div class="page-head"><div><h2>Solicitudes intergrupales</h2><p>Aprueba los participantes externos antes de habilitar el pago del equipo.</p></div></div><div class="alert info"><b>Flujo:</b> un grupo solicita apoyo → el aliado propone participantes → el solicitante acepta → administración verifica y aprueba.</div><div class="panel">${items.length?`<div class="table-wrap"><table><thead><tr><th>Equipo</th><th>Solicitante</th><th>Grupo aliado</th><th>Participantes</th><th>Estado</th><th>Observaciones</th><th>Acciones</th></tr></thead><tbody>${items.map(r=>`<tr><td><b>${esc(teamById(r.teamId)?.name||'')}</b><br><small>${esc(sportById(teamById(r.teamId)?.sportId)?.name||'')}</small></td><td>${esc(groupById(r.requesterGroupId)?.name||'')}</td><td>${esc(groupById(r.targetGroupId)?.name||'')}</td><td>${(r.proposedParticipantIds||[]).map(id=>`${esc(participantById(id)?.name||'')}<br><small>${esc(branchName(participantById(id)?.branch||''))}</small>`).join('<br>')||'-'}</td><td>${statusBadge(r.status)}</td><td>${esc(r.rejectionReason||r.adminNote||'-')}</td><td><div class="actions">${r.status==='admin_review'?`<button class="btn btn-sm btn-primary" onclick="approveIntergroupRequest('${r.id}')">Aprobar</button><button class="btn btn-sm btn-danger" onclick="rejectIntergroupAdmin('${r.id}')">Rechazar</button>`:'<span class="muted">Sin acción pendiente</span>'}</div></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No hay solicitudes intergrupales.</div>'}</div>`)}
function approveIntergroupRequest(id){const r=db.intergroupRequests.find(x=>x.id===id),t=teamById(r.teamId);r.status='admin_approved';r.adminNote='Participantes externos verificados y aprobados.';r.adminReviewedAt=new Date().toISOString();r.adminReviewedBy=session.name;t.status=teamIntergroupApproved(t)?'draft':'intergroup_review';audit('Aprobó solicitud intergrupal de '+t.name);saveDB();renderApp();toast('Alianza aprobada. El equipo podrá pagar cuando esté completo.','success')}
function rejectIntergroupAdmin(id){const r=db.intergroupRequests.find(x=>x.id===id),t=teamById(r.teamId),note=prompt('Motivo de rechazo para ambos grupos:','')||'';if(!note.trim())return toast('El motivo es obligatorio.','error');const remove=new Set(r.acceptedParticipantIds||r.proposedParticipantIds||[]);t.members=(t.members||[]).filter(x=>!remove.has(x));t.substitutes=(t.substitutes||[]).filter(x=>!remove.has(x));r.status='admin_rejected';r.adminNote=note.trim();r.adminReviewedAt=new Date().toISOString();t.status='draft';audit('Rechazó solicitud intergrupal de '+t.name);saveDB();renderApp();toast('Solicitud rechazada y participantes retirados del equipo.','success')}
function prepareTeamPayment(teamId){const t=teamById(teamId),s=sportById(t.sportId);if(!currentGroup().country)return toast('Selecciona un país antes de pagar.','error');if(t.members.length!==s.teamSize)return toast('El equipo todavía no está completo.','error');if(teamHasExternal(t)&&!teamIntergroupApproved(t))return toast('Administración debe aprobar los participantes externos antes del pago.','error');const external=t.members.filter(id=>participantById(id)?.groupId!==session.id).length;if(external>(s.maxExternal||0))return toast('El equipo supera el máximo de integrantes externos.','error');const fee=sportFee(s);if(fee<=0)return toast('Administración aún no ha definido la tarifa grupal.','error');openPaymentModal('team',teamId,`Inscripción de equipo · ${s.name}`,fee)}
function pendingPaymentEntities(){const teams=db.teams.filter(t=>(t.ownerGroupId||t.groupId)===session.id&&teamReadyForPayment(t)&&!t.paymentId&&sportFee(sportById(t.sportId))>0),inds=db.individualRegistrations.filter(r=>r.groupId===session.id&&!r.paymentId),stand=db.stands.find(s=>s.groupId===session.id&&!s.paymentId);const rows=[...teams.map(t=>({type:'team',id:t.id,label:'Equipo · '+t.name,amount:sportFee(sportById(t.sportId))})),...inds.map(r=>({type:'individual',id:r.id,label:'Individual · '+sportById(r.sportId)?.name,amount:r.amount})),...(stand?[{type:'stand',id:stand.id,label:'Stand · '+stand.name,amount:db.settings.standFee}]:[])];return rows.length?rows.map(x=>`<div class="participant-pick"><div style="flex:1"><b>${esc(x.label)}</b><br><small>${money(x.amount)}</small></div><button class="btn btn-sm btn-primary" onclick="payPendingEntity('${x.type}','${x.id}')">Registrar pago</button></div>`).join(''):'<p class="muted">No hay conceptos pendientes de pago.</p>'}
function publicEventResult(e){if(!e.resultPublished)return'';if(e.type==='match'){const a=teamById(e.teamAId)?.name||'Equipo A',b=teamById(e.teamBId)?.name||'Equipo B';return`<div class="public-score"><span>${esc(a)}</span><b>${e.result?.scoreA??'-'} – ${e.result?.scoreB??'-'}</b><span>${esc(b)}</span></div>`}const entries=[...(e.result?.entries||[])].sort((a,b)=>(a.rank||999)-(b.rank||999));return`<div class="public-ranking">${entries.map(x=>{const p=participantById(x.participantId);return`<div><b>${x.disqualified?'DQ':x.rank||'-'}</b><span>${esc(p?.name||'')}<small>${esc(groupById(p?.groupId)?.name||'')}</small></span><strong>${x.disqualified?'Descalificado':x.value===''?'-':esc(x.value)}</strong></div>`}).join('')}</div>`}
function publicCompetitionCard(e){return`<article class="public-event"><div class="public-event-head"><div><span class="kicker">${esc(branchName(e.branchId))}</span><h3>${esc(sportById(e.sportId)?.name||'')}</h3></div>${e.resultPublished?'<span class="badge green">Resultado oficial</span>':statusBadge(e.status)}</div><p class="public-title">${esc(scheduleTitle(e))}</p><div class="public-meta">📅 ${fmtDate(e.date)} · ${esc(e.time||'')} &nbsp; 📍 ${esc(e.venue||'Por definir')}</div>${e.resultPublished?publicEventResult(e):'<div class="alert info">Resultado pendiente de publicación.</div>'}</article>`}
function openPublicResults(){location.hash='resultados';renderApp()}
function closePublicResults(){history.replaceState(null,'',location.pathname+location.search);renderApp()}
function publicResultsScreen(){$('app').innerHTML=`<div class="public-shell"><header class="public-header"><div><span class="kicker">Acceso libre</span><h1>${esc(db.settings.publicResultsTitle||db.settings.eventName)}</h1><p>Consulta programación, marcadores, sesiones y clasificaciones oficiales.</p></div><div class="actions"><button class="btn btn-secondary" onclick="renderPublicResultsList()">↻ Actualizar</button><button class="btn btn-primary" onclick="closePublicResults()">${session?'Volver al panel':'Ingresar al sistema'}</button></div></header><section class="public-filters"><select id="publicSport"><option value="">Todos los deportes</option>${db.sports.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select><select id="publicBranch"><option value="">Todas las ramas</option>${db.branches.map(b=>`<option value="${b.id}">${esc(b.name)}</option>`).join('')}</select><select id="publicState"><option value="">Programación y resultados</option><option value="upcoming">Próximas competencias</option><option value="results">Solo resultados publicados</option></select></section><main id="publicContent"></main><footer class="public-footer">Información registrada por la organización y los árbitros de las Olimpiadas Scouts.</footer></div>`;['publicSport','publicBranch','publicState'].forEach(id=>$(id).onchange=renderPublicResultsList);renderPublicResultsList()}
function renderPublicResultsList(){const sportId=$('publicSport')?.value||'',branchId=$('publicBranch')?.value||'',state=$('publicState')?.value||'',now=new Date();let items=[...db.schedules].filter(e=>(!sportId||e.sportId===sportId)&&(!branchId||e.branchId===branchId));if(state==='upcoming')items=items.filter(e=>competitionDate(e)>=now&&!e.resultPublished);if(state==='results')items=items.filter(e=>e.resultPublished);items.sort((a,b)=>competitionDate(a)-competitionDate(b));const upcoming=items.filter(e=>!e.resultPublished),results=items.filter(e=>e.resultPublished).sort((a,b)=>competitionDate(b)-competitionDate(a));let ranking='';if(sportId){const s=sportById(sportId);ranking=s.type==='group'?publicStandings(sportId,branchId):publicIndividualLeaderboard(sportId,branchId)}$('publicContent').innerHTML=`${ranking}<section><div class="section-title"><h2>Resultados publicados</h2><span>${results.length}</span></div><div class="public-grid">${results.length?results.map(publicCompetitionCard).join(''):'<div class="empty">Aún no hay resultados publicados con estos filtros.</div>'}</div></section><section><div class="section-title"><h2>Próximas competencias</h2><span>${upcoming.length}</span></div><div class="public-grid">${upcoming.length?upcoming.map(publicCompetitionCard).join(''):'<div class="empty">No hay próximas competencias con estos filtros.</div>'}</div></section>`}
function publicStandings(sportId,branchId){const matches=db.schedules.filter(e=>e.sportId===sportId&&e.type==='match'&&e.resultPublished&&(!branchId||e.branchId===branchId)),map=new Map();matches.forEach(e=>{const a=e.teamAId,b=e.teamBId,sa=Number(e.result.scoreA),sb=Number(e.result.scoreB);[a,b].forEach(id=>{if(!map.has(id))map.set(id,{id,pj:0,pg:0,pe:0,pp:0,gf:0,gc:0,pts:0})});const A=map.get(a),B=map.get(b);A.pj++;B.pj++;A.gf+=sa;A.gc+=sb;B.gf+=sb;B.gc+=sa;if(sa>sb){A.pg++;A.pts+=3;B.pp++}else if(sb>sa){B.pg++;B.pts+=3;A.pp++}else{A.pe++;B.pe++;A.pts++;B.pts++}});const rows=[...map.values()].sort((a,b)=>b.pts-a.pts||(b.gf-b.gc)-(a.gf-a.gc)||b.gf-a.gf);if(!rows.length)return'';return`<section class="public-table-section"><div class="section-title"><h2>Tabla de posiciones</h2><span>${esc(branchId?branchName(branchId):'Todas las ramas')}</span></div><div class="table-wrap"><table><thead><tr><th>#</th><th>Equipo</th><th>PJ</th><th>PG</th><th>PE</th><th>PP</th><th>GF</th><th>GC</th><th>DG</th><th>PTS</th></tr></thead><tbody>${rows.map((r,i)=>`<tr><td><b>${i+1}</b></td><td>${esc(teamById(r.id)?.name||'')}</td><td>${r.pj}</td><td>${r.pg}</td><td>${r.pe}</td><td>${r.pp}</td><td>${r.gf}</td><td>${r.gc}</td><td>${r.gf-r.gc}</td><td><b>${r.pts}</b></td></tr>`).join('')}</tbody></table></div></section>`}
function publicIndividualLeaderboard(sportId,branchId){const s=sportById(sportId),best=new Map();db.schedules.filter(e=>e.sportId===sportId&&e.type==='session'&&e.resultPublished&&(!branchId||e.branchId===branchId)).forEach(e=>(e.result?.entries||[]).filter(x=>!x.disqualified&&x.value!=='').forEach(x=>{const old=best.get(x.participantId);if(!old||(s.resultOrder==='asc'?x.value<old.value:x.value>old.value))best.set(x.participantId,{...x,eventId:e.id})}));const rows=[...best.values()].sort((a,b)=>s.resultOrder==='asc'?a.value-b.value:b.value-a.value);if(!rows.length)return'';return`<section class="public-table-section"><div class="section-title"><h2>Clasificación general · ${esc(s.resultLabel||'Resultado')}</h2><span>${esc(branchId?branchName(branchId):'Todas las ramas')}</span></div><div class="podium-list">${rows.slice(0,20).map((r,i)=>{const p=participantById(r.participantId),g=groupById(p?.groupId);return`<div><b>${i+1}</b><span>${esc(p?.name||'')}<small>${g?.country?flagOf(g.country)+' ':''}${esc(g?.name||'')}</small></span><strong>${esc(r.value)}</strong></div>`}).join('')}</div></section>`}
function adminReports(){setPage(`<div class="page-head"><div><h2>Reportes y respaldo</h2><p>Exporta participantes, equipos, programación, resultados y pagos.</p></div></div><div class="grid-3"><div class="panel"><h3>Participantes</h3><p class="muted">Listado por grupo y rama.</p><button class="btn btn-primary btn-block" onclick="exportParticipantsCSV()">Descargar CSV</button></div><div class="panel"><h3>Equipos</h3><p class="muted">Integrantes y grupos vinculados.</p><button class="btn btn-primary btn-block" onclick="exportTeamsCSV()">Descargar CSV</button></div><div class="panel"><h3>Pagos</h3><p class="muted">Consolidado financiero.</p><button class="btn btn-primary btn-block" onclick="exportPaymentsCSV()">Descargar CSV</button></div><div class="panel"><h3>Programación</h3><p class="muted">Partidos, sesiones, lugares y árbitros.</p><button class="btn btn-primary btn-block" onclick="exportScheduleCSV()">Descargar CSV</button></div><div class="panel"><h3>Resultados</h3><p class="muted">Marcadores y resultados publicados.</p><button class="btn btn-primary btn-block" onclick="exportResultsCSV()">Descargar CSV</button></div><div class="panel"><h3>Portal público</h3><p class="muted">Vista libre para participantes y familias.</p><button class="btn btn-secondary btn-block" onclick="openPublicResults()">Abrir resultados</button></div></div><div class="grid-2"><div class="panel"><h3>Copia de seguridad completa</h3><p class="muted">Incluye datos y comprobantes almacenados en este navegador.</p><button class="btn btn-secondary btn-block" onclick="downloadBackup()">Descargar respaldo JSON</button></div><div class="panel"><h3>Restaurar respaldo</h3><p class="muted">Reemplaza la información actual por una copia anterior.</p><button class="btn btn-secondary btn-block" onclick="document.getElementById('backupFile').click()">Seleccionar respaldo</button></div></div><div class="panel"><h3>Zona de riesgo</h3><button class="btn btn-danger" onclick="resetSystem()">Restablecer datos de demostración</button></div>`);$('backupFile').onchange=restoreBackup}
function exportScheduleCSV(){exportRows('programacion_olimpiadas.csv',['Deporte','Rama','Tipo','Competencia','Fecha','Hora','Lugar','Árbitro','Estado','Publicado'],db.schedules.map(e=>[sportById(e.sportId)?.name,branchName(e.branchId),e.type==='match'?'Partido':'Sesión',scheduleTitle(e),e.date,e.time,e.venue,refereeById(e.refereeId)?.name,e.status,e.resultPublished?'Sí':'No']))}
function exportResultsCSV(){const rows=[];db.schedules.filter(e=>e.resultPublished).forEach(e=>{if(e.type==='match')rows.push([sportById(e.sportId)?.name,branchName(e.branchId),scheduleTitle(e),teamById(e.teamAId)?.name,e.result.scoreA,teamById(e.teamBId)?.name,e.result.scoreB,'']);else(e.result?.entries||[]).forEach(x=>rows.push([sportById(e.sportId)?.name,branchName(e.branchId),scheduleTitle(e),participantById(x.participantId)?.name,x.value,'','',x.disqualified?'DQ':x.rank]))});exportRows('resultados_olimpiadas.csv',['Deporte','Rama','Competencia','Participante o equipo A','Resultado A','Equipo B','Resultado B','Posición'],rows)}
window.addEventListener('hashchange',renderApp);

saveDB();renderApp();
</script>
</body>
