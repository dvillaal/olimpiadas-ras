function migrate(old){const n=seedDB();if(!old||typeof old!=='object')return n;return{...n,...old,version:3,settings:{...n.settings,...old.settings,bank:{...n.settings.bank,...(old.settings?.bank||{})}},branches:old.branches||n.branches,groups:old.groups||n.groups,participants:(old.participants||n.participants).map(p=>({...p,docType:p.docType||'TI',firstNames:p.firstNames||p.name||'',lastNames:p.lastNames||'',gender:p.gender||'',notes:p.notes||''})),sports:(old.sports||n.sports).map(s=>({...s,type:s.type||'group',fee:s.fee??null,allowIntergroup:s.allowIntergroup??true,maxExternal:s.maxExternal??Math.max(1,Math.floor((s.teamSize||1)/2)),description:s.description||''})),teams:(old.teams||[]).map(t=>({...t,ownerGroupId:t.ownerGroupId||t.groupId,groupId:t.groupId||t.ownerGroupId,status:t.status==='confirmed'?'confirmed':(t.status||'draft'),paymentId:t.paymentId||'',adminNote:t.adminNote||''})),individualRegistrations:old.individualRegistrations||[],intergroupRequests:old.intergroupRequests||[],payments:old.payments||[],stands:old.stands||[],reservedCountries:old.reservedCountries||[],audit:old.audit||[]}}
function loadDB(){try{const current=localStorage.getItem(DB_KEY);if(current)return migrate(JSON.parse(current));const old=localStorage.getItem(OLD_DB_KEY);return old?migrate(JSON.parse(old)):seedDB()}catch(e){return seedDB()}}

function ageOf(date){if(!date)return'';const d=new Date(date+'T00:00:00'),n=new Date();let a=n.getFullYear()-d.getFullYear();if(n<new Date(n.getFullYear(),d.getMonth(),d.getDate()))a--;return a}

function openFileDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open(FILE_DB,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(FILE_STORE))r.result.createObjectStore(FILE_STORE,{keyPath:'id'})};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function saveProof(file){const max=(db.settings.maxProofMB||8)*1024*1024;if(!file)throw new Error('Adjunta el comprobante.');if(file.size>max)throw new Error(`El archivo supera ${db.settings.maxProofMB||8} MB.`);if(!['application/pdf','image/jpeg','image/png'].includes(file.type))throw new Error('Solo se permiten PDF, JPG o PNG.');const id=uid('proof'),record={id,name:file.name,type:file.type,size:file.size,blob:file,createdAt:new Date().toISOString()};const d=await openFileDB();await new Promise((res,rej)=>{const tx=d.transaction(FILE_STORE,'readwrite');tx.objectStore(FILE_STORE).put(record);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)});d.close();return id}
async function getProof(id){if(!id)return null;const d=await openFileDB();const data=await new Promise((res,rej)=>{const r=d.transaction(FILE_STORE).objectStore(FILE_STORE).get(id);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});d.close();return data}
async function getAllProofs(){const d=await openFileDB();const data=await new Promise((res,rej)=>{const r=d.transaction(FILE_STORE).objectStore(FILE_STORE).getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error)});d.close();return data}
async function putProof(record){const d=await openFileDB();await new Promise((res,rej)=>{const tx=d.transaction(FILE_STORE,'readwrite');tx.objectStore(FILE_STORE).put(record);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)});d.close()}
async function deleteProof(id){if(!id)return;const d=await openFileDB();await new Promise((res,rej)=>{const tx=d.transaction(FILE_STORE,'readwrite');tx.objectStore(FILE_STORE).delete(id);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)});d.close()}
async function viewProof(id,download=false){const p=await getProof(id);if(!p){toast('No se encontró el comprobante.','error');return}const url=URL.createObjectURL(p.blob);if(download){const a=document.createElement('a');a.href=url;a.download=p.name;a.click()}else window.open(url,'_blank');setTimeout(()=>URL.revokeObjectURL(url),3000)}
function blobToBase64(blob){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(blob)})}function base64ToBlob(data){const [meta,body]=data.split(',');const type=(meta.match(/data:(.*);base64/)||[])[1]||'application/octet-stream';const bin=atob(body),arr=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);return new Blob([arr],{type})}

function deleteGroup(id){const g=groupById(id);if(!confirm(`¿Eliminar ${g.name} y sus datos relacionados?`))return;const pids=db.participants.filter(p=>p.groupId===id).map(p=>p.id);db.groups=db.groups.filter(x=>x.id!==id);db.participants=db.participants.filter(x=>x.groupId!==id);db.teams=db.teams.filter(t=>t.ownerGroupId!==id&&!t.members.some(p=>pids.includes(p)));db.individualRegistrations=db.individualRegistrations.filter(r=>r.groupId!==id);db.intergroupRequests=db.intergroupRequests.filter(r=>r.requesterGroupId!==id&&r.targetGroupId!==id);db.payments=db.payments.filter(p=>p.groupId!==id);db.stands=db.stands.filter(s=>s.groupId!==id);audit('Eliminó grupo '+g.name);renderApp();toast('Grupo eliminado.','success')}

function adminParticipants(){const groupOpts=db.groups.map(g=>`<option value="${g.id}">${esc(g.name)}</option>`).join(''),branchOpts=db.branches.filter(b=>b.active).map(b=>`<option value="${b.id}">${esc(b.name)}</option>`).join('');setPage(`<div class="page-head"><div><h2>Participantes</h2><p>Registra individualmente o carga la plantilla para Excel.</p></div><div class="actions"><button class="btn btn-secondary" onclick="downloadParticipantTemplateCSV()">⬇ Plantilla CSV</button><a class="btn btn-secondary" href="plantilla_participantes.xlsx" download>⬇ Plantilla Excel</a><button class="btn btn-primary" onclick="openImportParticipants()">⬆ Importar</button></div></div><div class="split"><div class="panel"><h3 id="participantFormTitle">Nuevo participante</h3><form id="participantForm"><input type="hidden" id="participantId"><div class="field"><label>Grupo *</label><select id="participantGroup" required><option value="">Seleccionar</option>${groupOpts}</select></div><div class="row"><div class="field"><label>Tipo documento</label><select id="participantDocType"><option>TI</option><option>CC</option><option>RC</option><option>CE</option><option>PA</option></select></div><div class="field"><label>Número *</label><input id="participantDoc" required></div></div><div class="row"><div class="field"><label>Nombres *</label><input id="participantFirst" required></div><div class="field"><label>Apellidos *</label><input id="participantLast" required></div></div><div class="row"><div class="field"><label>Fecha nacimiento</label><input id="participantBirth" type="date"></div><div class="field"><label>Rama *</label><select id="participantBranch" required>${branchOpts}</select></div></div><div class="row"><div class="field"><label>Género</label><select id="participantGender"><option value="">No especificar</option><option value="F">Femenino</option><option value="M">Masculino</option><option value="O">Otro</option></select></div><div class="field"><label>Teléfono</label><input id="participantPhone"></div></div><div class="field"><label>Correo</label><input id="participantEmail" type="email"></div><div class="field"><label>Observaciones</label><textarea id="participantNotes"></textarea></div><label class="checkline"><input type="checkbox" id="participantActive" checked> Participante activo</label><div class="actions"><button class="btn btn-primary">Guardar</button><button type="button" class="btn btn-secondary" onclick="clearParticipantForm()">Limpiar</button></div></form></div><div class="panel"><div class="toolbar"><input id="participantSearch" class="search" placeholder="Buscar participante o documento..."><select id="participantFilter" class="search" style="flex:0 1 240px"><option value="">Todos los grupos</option>${groupOpts}</select></div><div id="participantsTable"></div></div></div>`);$('participantForm').onsubmit=saveParticipant;$('participantSearch').oninput=renderParticipantsTable;$('participantFilter').onchange=renderParticipantsTable;renderParticipantsTable()}
function renderParticipantsTable(){const q=($('participantSearch')?.value||'').toLowerCase(),gf=$('participantFilter')?.value||'',items=db.participants.filter(p=>(!gf||p.groupId===gf)&&[p.name,p.document,branchName(p.branch),groupById(p.groupId)?.name].join(' ').toLowerCase().includes(q));$('participantsTable').innerHTML=items.length?`<div class="table-wrap"><table><thead><tr><th>Participante</th><th>Grupo</th><th>Rama</th><th>Edad</th><th>Deportes</th><th>Estado</th><th>Acciones</th></tr></thead><tbody>${items.map(p=>`<tr><td><b>${esc(p.name)}</b><br><small>${esc(p.docType)} ${esc(p.document)}</small></td><td>${esc(groupById(p.groupId)?.name||'Grupo eliminado')}</td><td>${esc(branchName(p.branch))}</td><td>${ageOf(p.birthdate)||'-'}</td><td>${participantSportCount(p.id)}</td><td>${p.active?'<span class="badge green">Activo</span>':'<span class="badge gray">Inactivo</span>'}</td><td><div class="actions"><button class="btn btn-sm btn-secondary" onclick="editParticipant('${p.id}')">Editar</button><button class="btn btn-sm btn-danger" onclick="deleteParticipant('${p.id}')">Eliminar</button></div></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No hay participantes para mostrar.</div>'}
function saveParticipant(e){e.preventDefault();const id=$('participantId').value,first=$('participantFirst').value.trim(),last=$('participantLast').value.trim(),data={groupId:$('participantGroup').value,docType:$('participantDocType').value,document:$('participantDoc').value.trim(),firstNames:first,lastNames:last,name:`${first} ${last}`.trim(),birthdate:$('participantBirth').value,branch:$('participantBranch').value,gender:$('participantGender').value,phone:$('participantPhone').value.trim(),email:$('participantEmail').value.trim(),notes:$('participantNotes').value.trim(),active:$('participantActive').checked};if(db.participants.some(p=>p.document===data.document&&p.id!==id)){toast('Ese documento ya está registrado.','error');return}if(id){Object.assign(participantById(id),data);audit('Actualizó participante '+data.name)}else{db.participants.push({id:uid('p'),...data});audit('Registró participante '+data.name)}saveDB();clearParticipantForm();renderParticipantsTable();toast('Participante guardado.','success')}
function clearParticipantForm(){$('participantForm').reset();$('participantId').value='';$('participantActive').checked=true;$('participantFormTitle').textContent='Nuevo participante'}
function editParticipant(id){const p=participantById(id);$('participantId').value=p.id;$('participantGroup').value=p.groupId;$('participantDocType').value=p.docType||'TI';$('participantDoc').value=p.document||'';$('participantFirst').value=p.firstNames||p.name||'';$('participantLast').value=p.lastNames||'';$('participantBirth').value=p.birthdate||'';$('participantBranch').value=p.branch;$('participantGender').value=p.gender||'';$('participantPhone').value=p.phone||'';$('participantEmail').value=p.email||'';$('participantNotes').value=p.notes||'';$('participantActive').checked=p.active;$('participantFormTitle').textContent='Editar participante';scrollTo({top:0,behavior:'smooth'})}
function deleteParticipant(id){const p=participantById(id),used=db.teams.some(t=>[...(t.members||[]),...(t.substitutes||[])].includes(id))||db.individualRegistrations.some(r=>r.participantIds.includes(id));if(used){toast('No puede eliminarse porque tiene inscripciones.','error');return}if(!confirm('¿Eliminar este participante?'))return;db.participants=db.participants.filter(x=>x.id!==id);audit('Eliminó participante '+p.name);renderParticipantsTable();toast('Participante eliminado.','success')}
function downloadParticipantTemplateCSV(){const sample=participantColumnsInfo()+`\nGS-001;TI;1234567890;Nombres;Apellidos;2012-05-20;tropa;F;3000000000;correo@ejemplo.com;ACTIVO;Ejemplo`;downloadBlob(new Blob(['\ufeff'+sample],{type:'text/csv;charset=utf-8'}),'plantilla_participantes.csv')}
function openImportParticipants(){openModal(`<div class="modal-head"><h3>Importar participantes</h3><button class="close" onclick="closeModal()">×</button></div><div class="alert info">Utiliza la plantilla CSV. Encabezados esperados:<br><b>${participantColumnsInfo()}</b></div><div class="field"><label>Archivo CSV</label><input type="file" id="csvFile" accept=".csv,text/csv"></div><div class="field"><label>También puedes pegar el contenido</label><textarea id="csvText" placeholder="${participantColumnsInfo()}"></textarea></div><button class="btn btn-primary btn-block" onclick="previewImportParticipants()">Validar archivo</button><div id="importPreview" style="margin-top:15px"></div>`)}
function parseCSV(raw){const lines=raw.replace(/^\ufeff/,'').replace(/\r/g,'').split('\n').filter(x=>x.trim());if(lines.length<2)throw new Error('El archivo no contiene registros.');const sep=lines[0].includes(';')?';':',';const heads=lines[0].split(sep).map(x=>x.trim().toUpperCase());return lines.slice(1).map((line,index)=>{const cols=line.split(sep).map(x=>x.trim().replace(/^"|"$/g,'')),obj={_row:index+2};heads.forEach((h,i)=>obj[h]=cols[i]||'');return obj})}
let pendingImport=[];
function validateImport(rows){const errors=[],valid=[];rows.forEach(r=>{const e=[],g=db.groups.find(x=>x.code===r.CODIGO_GRUPO),branch=(r.RAMA||'').toLowerCase(),status=(r.ESTADO||'ACTIVO').toUpperCase();if(!g)e.push('Código de grupo inexistente');if(!r.NUMERO_DOCUMENTO)e.push('Documento vacío');if(db.participants.some(p=>p.document===r.NUMERO_DOCUMENTO)||valid.some(v=>v.document===r.NUMERO_DOCUMENTO))e.push('Documento duplicado');if(!r.NOMBRES||!r.APELLIDOS)e.push('Nombre incompleto');if(!db.branches.some(b=>b.id===branch))e.push('Rama no reconocida');if(!['ACTIVO','INACTIVO'].includes(status))e.push('Estado inválido');const data={id:uid('p'),groupId:g?.id||'',docType:r.TIPO_DOCUMENTO||'TI',document:r.NUMERO_DOCUMENTO,firstNames:r.NOMBRES,lastNames:r.APELLIDOS,name:`${r.NOMBRES||''} ${r.APELLIDOS||''}`.trim(),birthdate:r.FECHA_NACIMIENTO||'',branch,gender:r.GENERO||'',phone:r.TELEFONO||'',email:r.CORREO||'',active:status==='ACTIVO',notes:r.OBSERVACIONES||'',_row:r._row};if(e.length)errors.push({...data,errors:e});else valid.push(data)});return{valid,errors}}
function previewImportParticipants(){const file=$('csvFile').files[0],text=$('csvText').value.trim(),process=raw=>{try{const result=validateImport(parseCSV(raw));pendingImport=result.valid;$('importPreview').innerHTML=`<div class="alert ${result.errors.length?'warning':'success'}"><b>${result.valid.length}</b> registros correctos · <b>${result.errors.length}</b> con error.</div>${result.errors.length?`<div class="table-wrap"><table><thead><tr><th>Fila</th><th>Documento</th><th>Nombre</th><th>Error</th></tr></thead><tbody>${result.errors.map(x=>`<tr><td>${x._row}</td><td>${esc(x.document)}</td><td>${esc(x.name)}</td><td>${esc(x.errors.join('; '))}</td></tr>`).join('')}</tbody></table></div>`:''}${result.valid.length?'<button class="btn btn-primary btn-block" style="margin-top:12px" onclick="confirmImportParticipants()">Importar registros correctos</button>':''}`}catch(e){toast(e.message,'error')}};if(file){const r=new FileReader();r.onload=e=>process(e.target.result);r.readAsText(file,'UTF-8')}else if(text)process(text);else toast('Selecciona un archivo o pega contenido.','error')}
function confirmImportParticipants(){db.participants.push(...pendingImport.map(({_row,...x})=>x));audit('Importó '+pendingImport.length+' participantes');saveDB();pendingImport=[];closeModal();renderApp();toast('Participantes importados.','success')}

function adminCountries(){setPage(`<div class="page-head"><div><h2>Países</h2><p>Reserva, asigna o libera países.</p></div></div><div class="panel"><div class="toolbar"><input id="countrySearch" class="search" placeholder="Buscar país..."><select id="countryFilter" class="search" style="flex:0 1 220px"><option value="">Todos</option><option value="available">Disponibles</option><option value="reserved">Reservados</option><option value="assigned">Asignados</option></select></div><div id="adminCountryGrid" class="country-grid"></div></div>`);$('countrySearch').oninput=renderAdminCountries;$('countryFilter').onchange=renderAdminCountries;renderAdminCountries()}
function renderAdminCountries(){const q=($('countrySearch')?.value||'').toLowerCase(),f=$('countryFilter')?.value||'';$('adminCountryGrid').innerHTML=COUNTRIES.filter(c=>c.name.toLowerCase().includes(q)&&(!f||countryStatus(c.code).key===f)).map(c=>{const s=countryStatus(c.code);return`<div class="country-card ${s.key!=='available'?'unavailable':''}"><span class="flag">${c.flag}</span><div style="flex:1"><b>${esc(c.name)}</b><small>${esc(s.label)}</small></div><div class="actions">${s.key==='available'?`<button class="btn btn-sm btn-warning" onclick="toggleReserve('${c.code}')">Reservar</button><button class="btn btn-sm btn-primary" onclick="assignCountryModal('${c.code}')">Asignar</button>`:`<button class="btn btn-sm btn-secondary" onclick="releaseCountry('${c.code}')">Liberar</button>`}</div></div>`}).join('')}

function releaseCountry(code){const g=db.groups.find(x=>x.country===code);if(g)g.country='';db.reservedCountries=db.reservedCountries.filter(x=>x!==code);audit('Liberó '+countryName(code));renderAdminCountries();toast('País liberado.','success')}

function adminBranches(){setPage(`<div class="page-head"><div><h2>Ramas</h2><p>Configura las ramas que pueden relacionarse con los deportes.</p></div></div><div class="grid-2"><div class="panel"><h3>Nueva rama</h3><form id="branchForm"><div class="field"><label>Identificador *</label><input id="branchId" placeholder="ej. lobatos" required></div><div class="field"><label>Nombre *</label><input id="branchName" required></div><button class="btn btn-primary">Crear rama</button></form></div><div class="panel"><h3>Ramas configuradas</h3>${db.branches.map(b=>`<div class="participant-pick"><div style="flex:1"><b>${esc(b.name)}</b><br><small>${esc(b.id)}</small></div>${b.active?'<span class="badge green">Activa</span>':'<span class="badge gray">Inactiva</span>'}<button class="btn btn-sm btn-secondary" onclick="toggleBranch('${b.id}')">${b.active?'Desactivar':'Activar'}</button></div>`).join('')}</div></div>`);$('branchForm').onsubmit=e=>{e.preventDefault();const id=$('branchId').value.trim().toLowerCase().replace(/\s+/g,'-'),name=$('branchName').value.trim();if(db.branches.some(b=>b.id===id))return toast('Ese identificador ya existe.','error');db.branches.push({id,name,active:true});audit('Creó rama '+name);renderApp();toast('Rama creada.','success')}}function toggleBranch(id){const b=db.branches.find(x=>x.id===id);b.active=!b.active;audit('Cambió estado de rama '+b.name);renderApp()}

s</label><input id="sportMaxExternal" type="number" min="0" value="1"></div><label class="checkline"><input type="checkbox" id="sportActive" checked> Deporte activo</label><div class="actions"><button class="btn btn-primary">Guardar</button><button type="button" class="btn btn-secondary" onclick="clearSportForm()">Limpiar</button></div></form></div><div class="panel"><div id="sportsAdminGrid" class="sport-grid"></div></div></div>`);$('sportForm').onsubmit=saveSport;$('sportType').onchange=syncSportType;renderSportsAdmin()}

function renderSportsAdmin(){$('sportsAdminGrid').innerHTML=db.sports.length?db.sports.map(s=>`<div class="sport-card"><div class="sport-icon">${esc(s.icon||'🏅')}</div><h3>${esc(s.name)}</h3><div class="sport-meta"><span class="badge ${s.type==='individual'?'blue':'green'}">${s.type==='individual'?'Individual':'Grupal'}</span><span class="badge gray">${s.type==='individual'?'1 participante':s.teamSize+' titulares'}</span><span class="badge yellow">${sportFee(s)>0?money(sportFee(s)):'Tarifa pendiente'}</span></div><p class="muted">${esc(s.description||'Sin descripción')}</p><p class="small muted">Ramas: ${s.branches.map(branchName).join(', ')}</p><p class="small muted">Intergrupal: ${s.allowIntergroup?'Sí':'No'}</p><div class="actions"><button class="btn btn-sm btn-secondary" onclick="editSport('${s.id}')">Editar</button><button class="btn btn-sm btn-danger" onclick="deleteSport('${s.id}')">Eliminar</button></div></div>`).join(''):'<div class="empty">No hay deportes.</div>'}
function saveSport(e){e.preventDefault();const id=$('sportId').value,feeRaw=$('sportFee').value,branches=[...document.querySelectorAll('[name=sportBranches]:checked')].map(x=>x.value);if(!branches.length)return toast('Selecciona al menos una rama.','error');const data={name:$('sportName').value.trim(),icon:$('sportIcon').value.trim()||'🏅',description:$('sportDescription').value.trim(),type:$('sportType').value,category:$('sportCategory').value.trim(),branches,teamSize:Number($('sportType').value==='individual'?1:$('sportTeamSize').value),subs:Number($('sportType').value==='individual'?0:$('sportSubs').value),maxTeams:Number($('sportMaxTeams').value||1),maxSports:Number($('sportMaxSports').value||3),deadline:$('sportDeadline').value,fee:feeRaw===''?null:Number(feeRaw),allowIntergroup:$('sportType').value==='group'&&$('sportIntergroup').checked,maxExternal:Number($('sportType').value==='group'?$('sportMaxExternal').value:0),active:$('sportActive').checked};if(id){Object.assign(sportById(id),data);audit('Actualizó deporte '+data.name)}else{db.sports.push({id:uid('s'),...data});audit('Creó deporte '+data.name)}saveDB();clearSportForm();renderSportsAdmin();toast('Deporte guardado.','success')}
function clearSportForm(){$('sportForm').reset();$('sportId').value='';$('sportIcon').value='🏅';$('sportTeamSize').value=1;$('sportSubs').value=0;$('sportMaxTeams').value=1;$('sportMaxSports').value=3;$('sportIntergroup').checked=true;$('sportMaxExternal').value=1;$('sportActive').checked=true;$('sportFormTitle').textContent='Nuevo deporte'}
function editSport(id){const s=sportById(id);$('sportId').value=s.id;$('sportName').value=s.name;$('sportIcon').value=s.icon||'🏅';$('sportDescription').value=s.description||'';$('sportType').value=s.type;$('sportCategory').value=s.category||'';document.querySelectorAll('[name=sportBranches]').forEach(x=>x.checked=s.branches.includes(x.value));$('sportTeamSize').value=s.teamSize;$('sportSubs').value=s.subs||0;$('sportMaxTeams').value=s.maxTeams||1;$('sportMaxSports').value=s.maxSports||3;$('sportDeadline').value=s.deadline||'';$('sportFee').value=s.fee??'';$('sportIntergroup').checked=!!s.allowIntergroup;$('sportMaxExternal').value=s.maxExternal||0;$('sportActive').checked=s.active;$('sportFormTitle').textContent='Editar deporte';scrollTo({top:0,behavior:'smooth'})}
function deleteSport(id){if(db.teams.some(t=>t.sportId===id)||db.individualRegistrations.some(r=>r.sportId===id))return toast('No puede eliminarse porque tiene inscripciones.','error');if(!confirm('¿Eliminar este deporte?'))return;const s=sportById(id);db.sports=db.sports.filter(x=>x.id!==id);audit('Eliminó deporte '+s.name);renderApp()}

function adminTeams(){const items=db.teams;setPage(`<div class="page-head"><div><h2>Equipos</h2><p>Consulta equipos propios e intergrupales.</p></div><button class="btn btn-secondary" onclick="exportTeamsCSV()">⬇ Exportar CSV</button></div><div class="panel">${items.length?`<div class="table-wrap"><table><thead><tr><th>Equipo</th><th>Grupo responsable</th><th>Deporte</th><th>Integrantes</th><th>Grupos vinculados</th><th>Estado</th><th>Acciones</th></tr></thead><tbody>${items.map(t=>{const groups=[...new Set((t.members||[]).map(id=>participantById(id)?.groupId).filter(Boolean))];return`<tr><td><b>${esc(t.name)}</b></td><td>${esc(groupById(t.ownerGroupId||t.groupId)?.name||'')}</td><td>${esc(sportById(t.sportId)?.name||'')}</td><td>${t.members.length}/${sportById(t.sportId)?.teamSize||0}</td><td>${groups.map(id=>esc(groupById(id)?.name||'')).join('<br>')}</td><td>${statusBadge(t.status)}</td><td><div class="actions"><button class="btn btn-sm btn-secondary" onclick="viewTeam('${t.id}')">Ver</button><button class="btn btn-sm btn-danger" onclick="adminDeleteTeam('${t.id}')">Eliminar</button></div></td></tr>`}).join('')}</tbody></table></div>`:'<div class="empty"><span class="big">🤝</span>No hay equipos registrados.</div>'}</div>`)}
function viewTeam(id){const t=teamById(id),s=sportById(t.sportId);openModal(`<div class="modal-head"><h3>${esc(t.name)}</h3><button class="close" onclick="closeModal()">×</button></div><div class="alert info"><b>${esc(s?.name||'')}</b> · Responsable: ${esc(groupById(t.ownerGroupId||t.groupId)?.name||'')} · ${statusBadge(t.status)}</div><h4>Titulares</h4>${(t.members||[]).map(id=>{const p=participantById(id);return`<div class="participant-pick"><div style="flex:1"><b>${esc(p?.name||'Participante eliminado')}</b><br><small>${esc(groupById(p?.groupId)?.name||'')} · ${esc(branchName(p?.branch||''))}</small></div>${t.captainId===id?'<span class="badge yellow">Capitán</span>':''}</div>`}).join('')}<h4>Suplentes</h4>${(t.substitutes||[]).length?t.substitutes.map(id=>{const p=participantById(id);return`<div class="participant-pick"><div><b>${esc(p?.name||'')}</b><br><small>${esc(groupById(p?.groupId)?.name||'')}</small></div></div>`}).join(''):'<p class="muted">Sin suplentes.</p>'}${t.adminNote?`<div class="alert warning"><b>Observación:</b> ${esc(t.adminNote)}</div>`:''}`)}
function adminDeleteTeam(id){const t=teamById(id);if(!confirm('¿Eliminar este equipo y sus solicitudes relacionadas?'))return;db.intergroupRequests=db.intergroupRequests.filter(r=>r.teamId!==id);db.teams=db.teams.filter(x=>x.id!==id);audit('Eliminó equipo '+t.name);renderApp()}

function adminRequests(){const items=db.intergroupRequests;setPage(`<div class="page-head"><div><h2>Solicitudes intergrupales</h2><p>Seguimiento de apoyos entre grupos.</p></div></div><div class="panel">${items.length?`<div class="table-wrap"><table><thead><tr><th>Equipo</th><th>Solicitante</th><th>Grupo aliado</th><th>Cantidad</th><th>Propuestos</th><th>Estado</th><th>Fecha</th></tr></thead><tbody>${items.map(r=>`<tr><td>${esc(teamById(r.teamId)?.name||'')}</td><td>${esc(groupById(r.requesterGroupId)?.name||'')}</td><td>${esc(groupById(r.targetGroupId)?.name||'')}</td><td>${r.count}</td><td>${(r.proposedParticipantIds||[]).map(id=>esc(participantById(id)?.name||'')).join('<br>')||'-'}</td><td>${statusBadge(r.status)}</td><td>${fmtDateTime(r.createdAt)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No hay solicitudes intergrupales.</div>'}</div>`)}

function adminPayments(){const items=[...db.payments].sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));setPage(`<div class="page-head"><div><h2>Pagos</h2><p>Revisa comprobantes y confirma las inscripciones.</p></div><button class="btn btn-secondary" onclick="exportPaymentsCSV()">⬇ Exportar CSV</button></div><div class="cards">${stat('⏳',items.filter(p=>['sent','review'].includes(p.status)).length,'Pendientes')}${stat('✅',items.filter(p=>p.status==='approved').length,'Aprobados')}${stat('⚠️',items.filter(p=>p.status==='correction').length,'Por corregir')}${stat('💰',money(items.filter(p=>p.status==='approved').reduce((a,p)=>a+Number(p.expectedAmount),0)),'Total aprobado')}</div><div class="panel"><div class="toolbar"><input id="paymentSearch" class="search" placeholder="Buscar grupo, referencia o concepto..."><select id="paymentFilter" class="search" style="flex:0 1 220px"><option value="">Todos</option><option value="sent">Enviados</option><option value="approved">Aprobados</option><option value="correction">Corrección</option><option value="rejected">Rechazados</option></select></div><div id="paymentsTable"></div></div>`);$('paymentSearch').oninput=renderPaymentsTable;$('paymentFilter').onchange=renderPaymentsTable;renderPaymentsTable()}
function renderPaymentsTable(){const q=($('paymentSearch')?.value||'').toLowerCase(),f=$('paymentFilter')?.value||'',items=db.payments.filter(p=>(!f||p.status===f)&&[p.concept,p.reference,p.payerName,groupById(p.groupId)?.name].join(' ').toLowerCase().includes(q));$('paymentsTable').innerHTML=items.length?`<div class="table-wrap"><table><thead><tr><th>Grupo</th><th>Concepto</th><th>Valor esperado</th><th>Valor reportado</th><th>Referencia</th><th>Comprobante</th><th>Estado</th><th>Acciones</th></tr></thead><tbody>${items.map(p=>`<tr><td>${esc(groupById(p.groupId)?.name||'')}</td><td><b>${esc(p.concept)}</b><br><small>${fmtDate(p.paymentDate)}</small></td><td>${money(p.expectedAmount)}</td><td>${money(p.reportedAmount)}</td><td>${esc(p.reference)}</td><td><div class="actions"><button class="btn btn-sm btn-secondary" onclick="viewProof('${p.proofId}')">Ver</button><button class="btn btn-sm btn-secondary" onclick="viewProof('${p.proofId}',true)">Descargar</button></div></td><td>${statusBadge(p.status)}${p.adminNote?`<br><small>${esc(p.adminNote)}</small>`:''}</td><td><div class="actions">${p.status!=='approved'?`<button class="btn btn-sm btn-primary" onclick="reviewPayment('${p.id}','approved')">Aprobar</button><button class="btn btn-sm btn-warning" onclick="reviewPayment('${p.id}','correction')">Corregir</button><button class="btn btn-sm btn-danger" onclick="reviewPayment('${p.id}','rejected')">Rechazar</button>`:'<span class="badge green">Finalizado</span>'}</div></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No hay pagos con esos filtros.</div>'}
function reviewPayment(id,status){const p=db.payments.find(x=>x.id===id);let note='';if(status!=='approved'){note=prompt(status==='correction'?'Indica qué debe corregir el grupo:':'Motivo del rechazo:','')||'';if(!note.trim())return toast('La observación es obligatoria.','error')}if(status==='approved'&&Number(p.reportedAmount)<Number(p.expectedAmount)&&!confirm('El valor reportado es inferior al esperado. ¿Aprobar de todas formas?'))return;p.status=status;p.adminNote=note;p.reviewedAt=new Date().toISOString();p.reviewedBy=session.name;applyPaymentStatus(p,status);audit(`${status==='approved'?'Aprobó':status==='correction'?'Solicitó corrección de':'Rechazó'} pago ${p.reference}`);saveDB();renderApp();toast('Estado del pago actualizado.','success')}
function applyPaymentStatus(p,status){const entity=status==='approved'?'approved':status;if(p.entityType==='team'){const t=teamById(p.entityId);if(t)t.status=status==='approved'?'confirmed':entity,t.adminNote=p.adminNote||''}if(p.entityType==='individual'){const r=db.individualRegistrations.find(x=>x.id===p.entityId);if(r)r.status=entity,r.adminNote=p.adminNote||''}if(p.entityType==='stand'){const s=db.stands.find(x=>x.id===p.entityId);if(s)s.status=entity,s.adminNote=p.adminNote||''}}

function adminStands(){const items=db.stands;setPage(`<div class="page-head"><div><h2>Stands de ventas</h2><p>Valor general: ${money(db.settings.standFee)} · Cupos: ${db.settings.standLimit}</p></div></div><div class="cards">${stat('🛍️',items.length,'Solicitudes')}${stat('✅',items.filter(s=>s.status==='approved').length,'Aprobadas')}${stat('⏳',items.filter(s=>['draft','payment_pending','sent'].includes(s.status)).length,'Pendientes')}${stat('📍',Math.max(0,db.settings.standLimit-items.filter(s=>s.status==='approved').length),'Cupos disponibles')}</div><div class="panel">${items.length?`<div class="table-wrap"><table><thead><tr><th>Grupo</th><th>Stand</th><th>Responsable</th><th>Productos</th><th>Pago</th><th>Estado</th></tr></thead><tbody>${items.map(s=>`<tr><td>${esc(groupById(s.groupId)?.name||'')}</td><td><b>${esc(s.name)}</b></td><td>${esc(s.responsible)}<br><small>${esc(s.phone||'')}</small></td><td>${esc(s.products)}</td><td>${s.paymentId?statusBadge(db.payments.find(p=>p.id===s.paymentId)?.status):'<span class="badge yellow">Pendiente</span>'}</td><td>${statusBadge(s.status)}${s.adminNote?`<br><small>${esc(s.adminNote)}</small>`:''}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty"><span class="big">🛍️</span>No hay solicitudes de stand.</div>'}</div>`)}

function adminReports(){setPage(`<div class="page-head"><div><h2>Reportes y respaldo</h2><p>Exporta información y conserva una copia local de los datos y comprobantes.</p></div></div><div class="grid-3"><div class="panel"><h3>Participantes</h3><p class="muted">Listado general con grupo, rama y documento.</p><button class="btn btn-primary btn-block" onclick="exportParticipantsCSV()">Descargar CSV</button></div><div class="panel"><h3>Equipos</h3><p class="muted">Equipos, deportes, integrantes y grupos vinculados.</p><button class="btn btn-primary btn-block" onclick="exportTeamsCSV()">Descargar CSV</button></div><div class="panel"><h3>Pagos</h3><p class="muted">Consolidado financiero y estados de revisión.</p><button class="btn btn-primary btn-block" onclick="exportPaymentsCSV()">Descargar CSV</button></div></div><div class="grid-2"><div class="panel"><h3>Copia de seguridad completa</h3><p class="muted">Incluye datos y comprobantes almacenados en este navegador.</p><button class="btn btn-secondary btn-block" onclick="downloadBackup()">Descargar respaldo JSON</button></div><div class="panel"><h3>Restaurar respaldo</h3><p class="muted">Reemplaza la información actual por una copia anterior.</p><button class="btn btn-secondary btn-block" onclick="$('backupFile').click()">Seleccionar respaldo</button></div></div><div class="panel"><h3>Zona de riesgo</h3><button class="btn btn-danger" onclick="resetSystem()">Restablecer datos de demostración</button></div>`);$('backupFile').onchange=restoreBackup}
function csvEscape(v){return`"${String(v??'').replace(/"/g,'""')}"`}function exportRows(name,headers,rows){const content=[headers,...rows].map(r=>r.map(csvEscape).join(';')).join('\n');downloadBlob(new Blob(['\ufeff'+content],{type:'text/csv;charset=utf-8'}),name)}
function exportParticipantsCSV(){exportRows('participantes_olimpiadas.csv',['Grupo','Código','Tipo documento','Documento','Nombres','Apellidos','Rama','Nacimiento','Estado'],db.participants.map(p=>[groupById(p.groupId)?.name,groupById(p.groupId)?.code,p.docType,p.document,p.firstNames,p.lastNames,branchName(p.branch),p.birthdate,p.active?'Activo':'Inactivo']))}
function exportTeamsCSV(){const rows=[];db.teams.forEach(t=>(t.members||[]).forEach(id=>{const p=participantById(id);rows.push([t.name,sportById(t.sportId)?.name,groupById(t.ownerGroupId||t.groupId)?.name,p?.name,groupById(p?.groupId)?.name,t.status])}));exportRows('equipos_olimpiadas.csv',['Equipo','Deporte','Grupo responsable','Participante','Grupo de origen','Estado'],rows)}
function exportPaymentsCSV(){exportRows('pagos_olimpiadas.csv',['Grupo','Concepto','Esperado','Reportado','Fecha','Referencia','Estado','Observación'],db.payments.map(p=>[groupById(p.groupId)?.name,p.concept,p.expectedAmount,p.reportedAmount,p.paymentDate,p.reference,p.status,p.adminNote||'']))}
async function downloadBackup(){try{const files=await getAllProofs(),encoded=[];for(const f of files)encoded.push({...f,blob:await blobToBase64(f.blob)});downloadBlob(new Blob([JSON.stringify({generatedAt:new Date().toISOString(),db,files:encoded},null,2)],{type:'application/json'}),`respaldo_olimpiadas_${new Date().toISOString().slice(0,10)}.json`);toast('Respaldo generado.','success')}catch(e){toast('No fue posible generar el respaldo: '+e.message,'error')}}
async function restoreBackup(e){const file=e.target.files[0];if(!file)return;if(!confirm('Esto reemplazará la información actual. ¿Continuar?'))return;e.target.value='';try{const data=JSON.parse(await file.text());db=migrate(data.db||data);saveDB();if(data.files)for(const f of data.files){await putProof({...f,blob:base64ToBlob(f.blob)})}audit('Restauró una copia de seguridad');renderApp();toast('Respaldo restaurado.','success')}catch(err){toast('El archivo no es un respaldo válido.','error')}}
function resetSystem(){if(!confirm('¿Restablecer todos los datos? Esta acción no se puede deshacer.'))return;db=seedDB();saveDB();renderApp();toast('Sistema restablecido.','success')}

function adminSettings(){const b=db.settings.bank;setPage(`<div class="page-head"><div><h2>Configuración</h2><p>Tarifas, cuenta bancaria, límites y credenciales.</p></div></div><div class="grid-2"><div class="panel"><h3>Evento y tarifas</h3><form id="settingsForm"><div class="field"><label>Nombre del evento</label><input id="setEvent" value="${esc(db.settings.eventName)}"></div><div class="row"><div class="field"><label>Deporte individual por participante</label><input id="setIndividual" type="number" min="0" value="${db.settings.individualFee}"></div><div class="field"><label>Deporte grupal por equipo</label><input id="setGroup" type="number" min="0" value="${db.settings.groupTeamFee}"></div></div><div class="row"><div class="field"><label>Stand de ventas</label><input id="setStand" type="number" min="0" value="${db.settings.standFee}"></div><div class="field"><label>Cantidad máxima de stands</label><input id="setStandLimit" type="number" min="0" value="${db.settings.standLimit}"></div></div><div class="field"><label>Tamaño máximo de comprobante (MB)</label><input id="setMaxProof" type="number" min="1" value="${db.settings.maxProofMB}"></div><button class="btn btn-primary">Guardar configuración</button></form></div><div class="panel"><h3>Cuenta bancaria</h3><form id="bankForm"><div class="field"><label>Nombre del bloque</label><input id="bankLabel" value="${esc(b.label)}"></div><div class="row"><div class="field"><label>Banco</label><input id="bankName" value="${esc(b.bank)}"></div><div class="field"><label>Tipo</label><input id="bankType" value="${esc(b.type)}"></div></div><div class="row"><div class="field"><label>Número</label><input id="bankNumber" value="${esc(b.number)}"></div><div class="field"><label>NIT</label><input id="bankNit" value="${esc(b.nit)}"></div></div><div class="field"><label>Titular</label><input id="bankHolder" value="${esc(b.holder)}"></div><button class="btn btn-primary">Guardar cuenta</button></form></div></div><div class="panel"><h3>Credenciales del administrador</h3><form id="adminCredForm" class="row-3"><div class="field"><label>Nombre</label><input id="adminName" value="${esc(db.admin.name)}"></div><div class="field"><label>Usuario</label><input id="adminUser" value="${esc(db.admin.username)}"></div><div class="field"><label>Contraseña</label><input id="adminPass" value="${esc(db.admin.password)}"></div><div><button class="btn btn-primary">Actualizar acceso</button></div></form></div>`);$('settingsForm').onsubmit=e=>{e.preventDefault();db.settings.eventName=$('setEvent').value.trim();db.settings.individualFee=Number($('setIndividual').value);db.settings.groupTeamFee=Number($('setGroup').value);db.settings.standFee=Number($('setStand').value);db.settings.standLimit=Number($('setStandLimit').value);db.settings.maxProofMB=Number($('setMaxProof').value);audit('Actualizó configuración y tarifas');renderApp();toast('Configuración guardada.','success')};$('bankForm').onsubmit=e=>{e.preventDefault();db.settings.bank={label:$('bankLabel').value.trim(),bank:$('bankName').value.trim(),type:$('bankType').value.trim(),number:$('bankNumber').value.trim(),nit:$('bankNit').value.trim(),holder:$('bankHolder').value.trim()};audit('Actualizó la cuenta bancaria');renderApp();toast('Cuenta guardada.','success')};$('adminCredForm').onsubmit=e=>{e.preventDefault();db.admin={name:$('adminName').value.trim(),username:$('adminUser').value.trim(),password:$('adminPass').value};session.name=db.admin.name;saveSession();audit('Actualizó credenciales del administrador');renderApp();toast('Credenciales actualizadas.','success')}}

function groupDashboard(){const g=currentGroup(),ownTeams=db.teams.filter(t=>(t.ownerGroupId||t.groupId)===g.id),inds=db.individualRegistrations.filter(r=>r.groupId===g.id),pendingPayments=db.payments.filter(p=>p.groupId===g.id&&p.status!=='approved').length,requests=db.intergroupRequests.filter(r=>(r.targetGroupId===g.id&&r.status==='pending')||(r.requesterGroupId===g.id&&r.status==='proposed')).length;setPage(`<div class="page-head"><div><h2>Hola, ${esc(g.name)}</h2><p>Organiza la representación, los deportistas y los pagos del grupo.</p></div></div>${!g.country?'<div class="alert warning"><b>Pendiente:</b> seleccionen el país que representarán.</div>':''}${requests?`<div class="alert info"><b>Tienen ${requests} solicitud(es) intergrupal(es) por atender.</b></div>`:''}<div class="cards">${stat('🌍',g.country?flagOf(g.country):'—',g.country?countryName(g.country):'País pendiente')}${stat('👥',db.participants.filter(p=>p.groupId===g.id&&p.active).length,'Participantes activos')}${stat('🤝',ownTeams.length,'Equipos creados')}${stat('💳',pendingPayments,'Pagos pendientes')}</div><div class="grid-2"><div class="panel"><h3>Avance de inscripción</h3>${groupProgress(g)}</div><div class="panel"><h3>Datos para pagar</h3>${bankCard()}</div></div>`)}
function groupProgress(g){const steps=[['País seleccionado',!!g.country],['Participantes cargados',db.participants.some(p=>p.groupId===g.id)],['Inscripción deportiva',db.teams.some(t=>(t.ownerGroupId||t.groupId)===g.id)||db.individualRegistrations.some(r=>r.groupId===g.id)],['Pagos aprobados',db.payments.some(p=>p.groupId===g.id&&p.status==='approved')]],done=steps.filter(x=>x[1]).length;return`<div class="progress"><div style="width:${done/steps.length*100}%"></div></div><p class="muted">${done} de ${steps.length} pasos principales completados</p>${steps.map(x=>`<div class="participant-pick"><span>${x[1]?'✅':'○'}</span><b>${esc(x[0])}</b></div>`).join('')}`}
function groupCountry(){const g=currentGroup();if(g.country){setPage(`<div class="page-head"><div><h2>País seleccionado</h2><p>País que representará el grupo.</p></div></div><div class="hero-country"><div class="flag-large">${flagOf(g.country)}</div><span class="kicker">Representarán a</span><h2>${esc(countryName(g.country))}</h2><p class="muted">El administrador puede liberar o cambiar esta elección.</p></div>`);return}setPage(`<div class="page-head"><div><h2>Escoger país</h2><p>Solo aparecen seleccionables los países disponibles.</p></div></div><div class="alert warning"><b>Importante:</b> cada país solo puede ser escogido por un grupo.</div><div class="panel"><div class="toolbar"><input id="gCountrySearch" class="search" placeholder="Buscar país..."></div><div id="gCountryGrid" class="country-grid"></div></div>`);$('gCountrySearch').oninput=renderGroupCountries;renderGroupCountries()}
function renderGroupCountries(){const q=($('gCountrySearch')?.value||'').toLowerCase();$('gCountryGrid').innerHTML=COUNTRIES.filter(c=>c.name.toLowerCase().includes(q)).map(c=>{const available=countryStatus(c.code).key==='available';return`<div class="country-card ${available?'':'unavailable'}"><span class="flag">${c.flag}</span><div style="flex:1"><b>${esc(c.name)}</b><small>${available?'Disponible':'No disponible'}</small></div>${available?`<button class="btn btn-sm btn-primary" onclick="confirmCountry('${c.code}')">Seleccionar</button>`:''}</div>`}).join('')}
function confirmCountry(code){openModal(`<div class="modal-head"><h3>Confirmar país</h3><button class="close" onclick="closeModal()">×</button></div><div class="hero-country"><div class="flag-large">${flagOf(code)}</div><h2>${esc(countryName(code))}</h2><p>Representarán a este país durante las Olimpiadas Scouts.</p></div><button class="btn btn-primary btn-block" onclick="selectCountry('${code}')">Confirmar elección</button>`)}
function selectCountry(code){if(countryStatus(code).key!=='available')return toast('El país ya no está disponible.','error');currentGroup().country=code;audit(currentGroup().name+' seleccionó '+countryName(code));closeModal();renderApp();toast('País seleccionado.','success')}
function groupParticipants(){const g=currentGroup(),items=db.participants.filter(p=>p.groupId===g.id&&p.active);setPage(`<div class="page-head"><div><h2>Mis participantes</h2><p>Solo aparecen las personas registradas por administración.</p></div></div><div class="panel">${items.length?`<div class="table-wrap"><table><thead><tr><th>Participante</th><th>Rama</th><th>Edad</th><th>Documento</th><th>Deportes</th></tr></thead><tbody>${items.map(p=>`<tr><td><b>${esc(p.name)}</b></td><td>${esc(branchName(p.branch))}</td><td>${ageOf(p.birthdate)||'-'}</td><td>•••${esc((p.document||'').slice(-4))}</td><td>${participantSportCount(p.id)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty"><span class="big">👥</span>No hay participantes habilitados.</div>'}</div>`)}

function groupSports(){const g=currentGroup();setPage(`<div class="page-head"><div><h2>Deportes disponibles</h2><p>Los deportes individuales cobran por participante; los grupales, por equipo.</p></div></div>${!g.country?'<div class="alert warning">Puedes crear borradores, pero debes escoger país antes de enviar inscripciones.</div>':''}${db.settings.groupTeamFee<=0?'<div class="alert warning">La tarifa general de deportes grupales todavía no ha sido definida. Podrás crear equipos, pero no pagar hasta que administración configure el valor.</div>':''}<div class="sport-grid">${db.sports.filter(s=>s.active).map(s=>{const fee=sportFee(s),closed=s.deadline&&new Date(s.deadline+'T23:59:59')<new Date();return`<div class="sport-card"><div class="sport-icon">${esc(s.icon||'🏅')}</div><h3>${esc(s.name)}</h3><div class="sport-meta"><span class="badge ${s.type==='individual'?'blue':'green'}">${s.type==='individual'?'Individual':'Grupal'}</span><span class="badge yellow">${fee>0?money(fee)+(s.type==='individual'?' por participante':' por equipo'):'Tarifa pendiente'}</span></div><p class="muted">${esc(s.description||'')}</p><p class="small muted">Ramas: ${s.branches.map(branchName).join(', ')}</p>${s.type==='group'?`<p class="small muted">Equipo: ${s.teamSize} titulares · ${s.subs||0} suplentes · Intergrupal: ${s.allowIntergroup?'Sí':'No'}</p>`:''}${closed?'<span class="badge red">Inscripción cerrada</span>':`<button class="btn btn-primary btn-block" onclick="${s.type==='individual'?`openIndividualRegistration('${s.id}')`:`openTeamForm('${s.id}')`}">${s.type==='individual'?'Inscribir participantes':'Crear equipo'}</button>`}</div>`}).join('')}</div>`)}
function eligibleOwnParticipants(s,exclude=''){return db.participants.filter(p=>p.groupId===session.id&&p.active&&s.branches.includes(p.branch)&&participantSportCount(p.id,exclude)<(s.maxSports||3))}
function openIndividualRegistration(sportId,regId=''){const s=sportById(sportId),reg=regId?db.individualRegistrations.find(r=>r.id===regId):null,already=new Set(db.individualRegistrations.filter(r=>r.sportId===sportId&&r.groupId===session.id&&r.id!==regId&&r.status!=='rejected').flatMap(r=>r.participantIds)),eligible=eligibleOwnParticipants(s,regId);openModal(`<div class="modal-head"><h3>${esc(s.name)} · Inscripción individual</h3><button class="close" onclick="closeModal()">×</button></div><div class="alert info">Valor: <b>${money(sportFee(s))} por participante</b>. El sistema calculará el total automáticamente.</div><div>${eligible.map(p=>{const blocked=already.has(p.id);return`<label class="participant-pick ${blocked?'muted':''}"><input type="checkbox" name="individualMembers" value="${p.id}" ${reg?.participantIds.includes(p.id)?'checked':''} ${blocked?'disabled':''}><div style="flex:1"><b>${esc(p.name)}</b><br><small>${esc(branchName(p.branch))}${blocked?' · Ya inscrito en este deporte':''}</small></div></label>`}).join('')||'<div class="empty">No hay participantes elegibles.</div>'}</div><div class="actions"><button class="btn btn-secondary" onclick="saveIndividualRegistration('${sportId}','${regId}',false)">Guardar borrador</button><button class="btn btn-primary" onclick="saveIndividualRegistration('${sportId}','${regId}',true)">Continuar al pago</button></div>`)}
function saveIndividualRegistration(sportId,regId,toPayment){const s=sportById(sportId),ids=[...document.querySelectorAll('[name=individualMembers]:checked')].map(x=>x.value);if(!ids.length)return toast('Selecciona al menos un participante.','error');if(!currentGroup().country&&toPayment)return toast('Selecciona un país antes de enviar.','error');let reg=regId?db.individualRegistrations.find(r=>r.id===regId):null;if(reg)Object.assign(reg,{participantIds:ids,amount:ids.length*sportFee(s),status:'draft',updatedAt:new Date().toISOString()});else{reg={id:uid('ir'),groupId:session.id,sportId,participantIds:ids,amount:ids.length*sportFee(s),status:'draft',paymentId:'',createdAt:new Date().toISOString()};db.individualRegistrations.push(reg)}audit(currentGroup().name+' guardó inscripción individual en '+s.name);saveDB();closeModal();if(toPayment)openPaymentModal('individual',reg.id,`Inscripción individual · ${s.name}`,reg.amount);else{renderApp();toast('Inscripción guardada como borrador.','success')}}

function openTeamForm(sportId,teamId=''){const s=sportById(sportId),g=currentGroup(),team=teamId?teamById(teamId):null,eligible=eligibleOwnParticipants(s,teamId);openModal(`<div class="modal-head"><h3>${team?'Editar':'Crear'} equipo · ${esc(s.name)}</h3><button class="close" onclick="closeModal()">×</button></div><div class="alert info">Selecciona hasta <b>${s.teamSize} titulares</b>. Si no alcanzas a completarlo, guarda el borrador y solicita integrantes de otro grupo.</div><div class="field"><label>Nombre del equipo</label><input id="teamName" value="${esc(team?.name||`${g.name} - ${s.name}`)}"></div><h4>Titulares del propio grupo</h4>${eligible.map(p=>`<label class="participant-pick"><input type="checkbox" name="teamMembers" value="${p.id}" ${team?.members.includes(p.id)?'checked':''}><div style="flex:1"><b>${esc(p.name)}</b><br><small>${esc(branchName(p.branch))} · ${participantSportCount(p.id,teamId)} deporte(s)</small></div></label>`).join('')||'<div class="empty">No hay participantes elegibles.</div>'}<h4>Suplentes del propio grupo</h4>${eligible.map(p=>`<label class="participant-pick"><input type="checkbox" name="teamSubs" value="${p.id}" ${(team?.substitutes||[]).includes(p.id)?'checked':''}><div><b>${esc(p.name)}</b></div></label>`).join('')}<div class="field"><label>Capitán</label><select id="teamCaptain"><option value="">Seleccionar</option>${eligible.map(p=>`<option value="${p.id}" ${team?.captainId===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div><button class="btn btn-primary btn-block" onclick="saveTeamDraft('${sportId}','${teamId}')">Guardar equipo</button>`)}
function saveTeamDraft(sportId,teamId){const s=sportById(sportId),g=currentGroup(),selected=[...document.querySelectorAll('[name=teamMembers]:checked')].map(x=>x.value),subs=[...document.querySelectorAll('[name=teamSubs]:checked')].map(x=>x.value),existing=teamId?teamById(teamId):null,external=(existing?.members||[]).filter(id=>participantById(id)?.groupId!==g.id),externalSubs=(existing?.substitutes||[]).filter(id=>participantById(id)?.groupId!==g.id),members=[...external,...selected],substitutes=[...externalSubs,...subs],captain=$('teamCaptain').value,name=$('teamName').value.trim();if(new Set([...members,...substitutes]).size!==members.length+substitutes.length)return toast('Una persona no puede ser titular y suplente.','error');if(members.length>s.teamSize)return toast(`El equipo admite ${s.teamSize} titulares.`,'error');if(substitutes.length>(s.subs||0))return toast(`Solo se permiten ${s.subs||0} suplentes.`,'error');if(captain&&!members.includes(captain))return toast('El capitán debe ser titular.','error');const data={ownerGroupId:g.id,groupId:g.id,sportId,name:name||`${g.name} - ${s.name}`,members,substitutes,captainId:captain,status:existing?.status==='confirmed'?'confirmed':'draft',paymentId:existing?.paymentId||'',adminNote:existing?.adminNote||'',updatedAt:new Date().toISOString()};if(existing)Object.assign(existing,data);else{if(db.teams.filter(t=>(t.ownerGroupId||t.groupId)===g.id&&t.sportId===sportId).length>=(s.maxTeams||1))return toast('Alcanzaste el máximo de equipos.','error');db.teams.push({id:uid('t'),createdAt:new Date().toISOString(),...data})}audit(g.name+' guardó equipo de '+s.name);saveDB();closeModal();renderApp();toast('Equipo guardado.','success')}
function groupTeams(){const g=currentGroup(),items=db.teams.filter(t=>(t.ownerGroupId||t.groupId)===g.id);setPage(`<div class="page-head"><div><h2>Mis equipos</h2><p>Completa equipos propios o solicita participantes de otro grupo.</p></div></div><div class="sport-grid">${items.length?items.map(t=>teamGroupCard(t)).join(''):'<div class="empty"><span class="big">🤝</span>Todavía no has creado equipos.</div>'}</div>`)}
function teamGroupCard(t){const s=sportById(t.sportId),missing=Math.max(0,(s?.teamSize||0)-t.members.length),external=t.members.filter(id=>participantById(id)?.groupId!==session.id).length,fee=sportFee(s),canPay=missing===0&&fee>0&&!t.paymentId&&t.status!=='confirmed';return`<div class="sport-card"><div class="sport-icon">${esc(s?.icon||'🏅')}</div><h3>${esc(t.name)}</h3><p><b>${esc(s?.name||'')}</b></p><div class="sport-meta">${statusBadge(t.status)}<span class="badge blue">${t.members.length}/${s?.teamSize||0} titulares</span>${external?`<span class="badge orange">${external} externos</span>`:''}</div>${missing?`<div class="alert warning">Faltan <b>${missing}</b> integrante(s).</div>`:''}${t.adminNote?`<div class="alert danger">${esc(t.adminNote)}</div>`:''}<div class="actions"><button class="btn btn-sm btn-secondary" onclick="viewTeam('${t.id}')">Ver</button>${t.status==='draft'?`<button class="btn btn-sm btn-secondary" onclick="openTeamForm('${t.sportId}','${t.id}')">Editar</button>`:''}${missing&&s?.allowIntergroup?`<button class="btn btn-sm btn-warning" onclick="openSupportRequest('${t.id}')">Solicitar apoyo</button>`:''}${canPay?`<button class="btn btn-sm btn-primary" onclick="prepareTeamPayment('${t.id}')">Pagar ${money(fee)}</button>`:''}${missing===0&&fee<=0&&t.status==='draft'?'<span class="badge red">Tarifa grupal pendiente</span>':''}</div></div>`}
function openSupportRequest(teamId){const t=teamById(teamId),s=sportById(t.sportId),missing=s.teamSize-t.members.length;if(missing<=0)return toast('El equipo ya está completo.','error');const max=Math.min(missing,s.maxExternal||missing),existing=db.intergroupRequests.find(r=>r.teamId===teamId&&['pending','proposed'].includes(r.status));if(existing)return toast('Ya existe una solicitud activa para este equipo.','error');openModal(`<div class="modal-head"><h3>Solicitar apoyo para ${esc(t.name)}</h3><button class="close" onclick="closeModal()">×</button></div><div class="alert info">Faltan ${missing} integrantes. Este deporte permite máximo ${s.maxExternal||missing} externos.</div><div class="field"><label>Grupo aliado *</label><select id="supportGroup"><option value="">Seleccionar</option>${db.groups.filter(g=>g.id!==session.id&&g.active).map(g=>`<option value="${g.id}">${esc(g.name)}</option>`).join('')}</select></div><div class="field"><label>Cantidad solicitada *</label><input id="supportCount" type="number" min="1" max="${max}" value="${max}"></div><div class="field"><label>Mensaje</label><textarea id="supportMessage" placeholder="Cuéntales qué necesitan para completar el equipo."></textarea></div><button class="btn btn-primary btn-block" onclick="sendSupportRequest('${teamId}')">Enviar solicitud</button>`)}
function sendSupportRequest(teamId){const target=$('supportGroup').value,count=Number($('supportCount').value),message=$('supportMessage').value.trim();if(!target||count<1)return toast('Completa los datos de la solicitud.','error');db.intergroupRequests.push({id:uid('req'),teamId,requesterGroupId:session.id,targetGroupId:target,count,message,status:'pending',proposedParticipantIds:[],createdAt:new Date().toISOString()});audit(currentGroup().name+' solicitó apoyo a '+groupById(target).name);saveDB();closeModal();renderApp();toast('Solicitud enviada.','success')}
function prepareTeamPayment(teamId){const t=teamById(teamId),s=sportById(t.sportId);if(!currentGroup().country)return toast('Selecciona un país antes de pagar.','error');if(t.members.length!==s.teamSize)return toast('El equipo todavía no está completo.','error');const external=t.members.filter(id=>participantById(id)?.groupId!==session.id).length;if(external>(s.maxExternal||0))return toast('El equipo supera el máximo de integrantes externos.','error');const fee=sportFee(s);if(fee<=0)return toast('Administración aún no ha definido la tarifa grupal.','error');openPaymentModal('team',teamId,`Inscripción de equipo · ${s.name}`,fee)}

function groupRequests(){const incoming=db.intergroupRequests.filter(r=>r.targetGroupId===session.id),outgoing=db.intergroupRequests.filter(r=>r.requesterGroupId===session.id);setPage(`<div class="page-head"><div><h2>Solicitudes intergrupales</h2><p>Gestiona apoyos recibidos y solicitudes enviadas.</p></div></div><div class="grid-2"><div class="panel"><h3>Solicitudes recibidas</h3>${incoming.length?incoming.map(requestReceivedCard).join(''):'<div class="empty">No hay solicitudes recibidas.</div>'}</div><div class="panel"><h3>Solicitudes enviadas</h3>${outgoing.length?outgoing.map(requestSentCard).join(''):'<div class="empty">No hay solicitudes enviadas.</div>'}</div></div>`)}
function requestReceivedCard(r){const t=teamById(r.teamId),s=sportById(t?.sportId);return`<div class="participant-pick"><div style="flex:1"><b>${esc(t?.name||'Equipo')}</b><br><small>${esc(groupById(r.requesterGroupId)?.name||'')} · ${esc(s?.name||'')} · Solicitan ${r.count}</small><br>${statusBadge(r.status)}</div>${r.status==='pending'?`<button class="btn btn-sm btn-primary" onclick="openProposeParticipants('${r.id}')">Responder</button>`:''}${r.status==='proposed'?'<span class="badge blue">Esperando aceptación</span>':''}${r.status==='accepted'?'<span class="badge green">Aceptada</span>':''}</div>`}
function requestSentCard(r){const names=(r.proposedParticipantIds||[]).map(id=>participantById(id)?.name).filter(Boolean).join(', ');return`<div class="participant-pick"><div style="flex:1"><b>${esc(teamById(r.teamId)?.name||'')}</b><br><small>Grupo aliado: ${esc(groupById(r.targetGroupId)?.name||'')} · ${r.count} solicitado(s)</small><br>${statusBadge(r.status)}${names?`<br><small>Propuestos: ${esc(names)}</small>`:''}</div>${r.status==='proposed'?`<button class="btn btn-sm btn-primary" onclick="acceptProposal('${r.id}')">Aceptar</button><button class="btn btn-sm btn-danger" onclick="rejectProposal('${r.id}')">Rechazar</button>`:''}</div>`}
function openProposeParticipants(requestId){const r=db.intergroupRequests.find(x=>x.id===requestId),t=teamById(r.teamId),s=sportById(t.sportId),eligible=db.participants.filter(p=>p.groupId===session.id&&p.active&&s.branches.includes(p.branch)&&participantSportCount(p.id)<(s.maxSports||3)&&!t.members.includes(p.id));openModal(`<div class="modal-head"><h3>Proponer participantes</h3><button class="close" onclick="closeModal()">×</button></div><div class="alert info">Selecciona hasta ${r.count} participante(s). El grupo solicitante verá sus nombres únicamente después de esta autorización.</div>${eligible.map(p=>`<label class="participant-pick"><input type="checkbox" name="proposalMembers" value="${p.id}"><div><b>${esc(p.name)}</b><br><small>${esc(branchName(p.branch))} · ${participantSportCount(p.id)} deporte(s)</small></div></label>`).join('')||'<div class="empty">No hay participantes elegibles.</div>'}<button class="btn btn-primary btn-block" onclick="submitProposal('${requestId}')">Enviar propuesta</button>`)}
function submitProposal(requestId){const r=db.intergroupRequests.find(x=>x.id===requestId),ids=[...document.querySelectorAll('[name=proposalMembers]:checked')].map(x=>x.value);if(!ids.length||ids.length>r.count)return toast(`Selecciona entre 1 y ${r.count} participantes.`, 'error');r.proposedParticipantIds=ids;r.status='proposed';r.respondedAt=new Date().toISOString();audit(currentGroup().name+' propuso participantes para '+teamById(r.teamId)?.name);saveDB();closeModal();renderApp();toast('Participantes propuestos.','success')}
function acceptProposal(requestId){const r=db.intergroupRequests.find(x=>x.id===requestId),t=teamById(r.teamId),s=sportById(t.sportId),space=s.teamSize-t.members.length,ids=(r.proposedParticipantIds||[]).slice(0,space);if(!ids.length)return toast('No hay participantes propuestos.','error');const externalNow=t.members.filter(id=>participantById(id)?.groupId!==session.id).length;if(externalNow+ids.length>(s.maxExternal||0))return toast('La propuesta supera el máximo de integrantes externos.','error');t.members=[...new Set([...t.members,...ids])];r.status='accepted';r.acceptedParticipantIds=ids;r.acceptedAt=new Date().toISOString();audit(currentGroup().name+' aceptó apoyo de '+groupById(r.targetGroupId).name);saveDB();renderApp();toast('Propuesta aceptada y participantes agregados.','success')}
function rejectProposal(requestId){const r=db.intergroupRequests.find(x=>x.id===requestId);r.status='rejected';r.rejectedAt=new Date().toISOString();audit(currentGroup().name+' rechazó una propuesta intergrupal');renderApp()}

function openPaymentModal(entityType,entityId,concept,expectedAmount){const old=db.payments.find(p=>p.entityType===entityType&&p.entityId===entityId&&p.status!=='approved');openModal(`<div class="modal-head"><h3>Registrar pago</h3><button class="close" onclick="closeModal()">×</button></div>${bankCard()}<div class="alert warning">Valor a consignar: <b>${money(expectedAmount)}</b>. Conserva y adjunta el comprobante.</div><form id="paymentForm"><div class="row"><div class="field"><label>Valor pagado *</label><input id="payAmount" type="number" min="0" value="${old?.reportedAmount||expectedAmount}" required></div><div class="field"><label>Fecha del pago *</label><input id="payDate" type="date" value="${old?.paymentDate||new Date().toISOString().slice(0,10)}" required></div></div><div class="row"><div class="field"><label>Nombre del pagador *</label><input id="payPayer" value="${esc(old?.payerName||currentGroup().leader||'')}" required></div><div class="field"><label>Documento del pagador</label><input id="payPayerDoc" value="${esc(old?.payerDocument||'')}"></div></div><div class="row"><div class="field"><label>Entidad de origen</label><input id="payOrigin" value="${esc(old?.originBank||'')}"></div><div class="field"><label>Referencia de transacción *</label><input id="payReference" value="${esc(old?.reference||'')}" required></div></div><div class="field"><label>Comprobante PDF, JPG o PNG *</label><input id="payProof" type="file" accept="application/pdf,image/jpeg,image/png" ${old?.proofId?'':'required'}></div><div class="field"><label>Observaciones</label><textarea id="payNotes">${esc(old?.notes||'')}</textarea></div><button class="btn btn-primary btn-block">Enviar pago para revisión</button></form>`);$('paymentForm').onsubmit=e=>submitPayment(e,{entityType,entityId,concept,expectedAmount,oldId:old?.id||''})}
async function submitPayment(e,ctx){e.preventDefault();const file=$('payProof').files[0],old=ctx.oldId?db.payments.find(p=>p.id===ctx.oldId):null,reference=$('payReference').value.trim();if(db.payments.some(p=>p.reference===reference&&p.id!==ctx.oldId))return toast('Esta referencia ya fue utilizada.','error');try{let proofId=old?.proofId||'';if(file){const newId=await saveProof(file);if(proofId)await deleteProof(proofId);proofId=newId}if(!proofId)throw new Error('Adjunta el comprobante.');const data={groupId:session.id,entityType:ctx.entityType,entityId:ctx.entityId,concept:ctx.concept,expectedAmount:Number(ctx.expectedAmount),reportedAmount:Number($('payAmount').value),paymentDate:$('payDate').value,payerName:$('payPayer').value.trim(),payerDocument:$('payPayerDoc').value.trim(),originBank:$('payOrigin').value.trim(),reference,proofId,notes:$('payNotes').value.trim(),status:'sent',adminNote:'',createdAt:old?.createdAt||new Date().toISOString(),updatedAt:new Date().toISOString()};let payment;if(old){Object.assign(old,data);payment=old}else{payment={id:uid('pay'),...data};db.payments.push(payment)}linkPayment(ctx.entityType,ctx.entityId,payment.id);audit(currentGroup().name+' envió pago '+reference);saveDB();closeModal();renderApp();toast('Pago enviado para revisión.','success')}catch(err){toast(err.message,'error')}}
function linkPayment(type,id,paymentId){if(type==='team'){const x=teamById(id);x.paymentId=paymentId;x.status='payment_pending'}if(type==='individual'){const x=db.individualRegistrations.find(r=>r.id===id);x.paymentId=paymentId;x.status='payment_pending'}if(type==='stand'){const x=db.stands.find(s=>s.id===id);x.paymentId=paymentId;x.status='payment_pending'}}
function groupPayments(){const g=currentGroup(),items=db.payments.filter(p=>p.groupId===g.id).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));setPage(`<div class="page-head"><div><h2>Mis pagos</h2><p>Consulta comprobantes y estados de revisión.</p></div></div>${bankCard()}<div class="panel">${items.length?`<div class="table-wrap"><table><thead><tr><th>Concepto</th><th>Valor</th><th>Referencia</th><th>Comprobante</th><th>Estado</th><th>Acciones</th></tr></thead><tbody>${items.map(p=>`<tr><td><b>${esc(p.concept)}</b><br><small>${fmtDate(p.paymentDate)}</small></td><td>${money(p.expectedAmount)}</td><td>${esc(p.reference)}</td><td><button class="btn btn-sm btn-secondary" onclick="viewProof('${p.proofId}')">Ver</button></td><td>${statusBadge(p.status)}${p.adminNote?`<br><small>${esc(p.adminNote)}</small>`:''}</td><td>${['correction','rejected'].includes(p.status)?`<button class="btn btn-sm btn-primary" onclick="editPayment('${p.id}')">Corregir pago</button>`:''}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Todavía no hay pagos registrados.</div>'}</div><div class="panel"><h3>Inscripciones pendientes de pago</h3>${pendingPaymentEntities()}</div>`)}

function branchById(id){return db.branches.find(b=>b.id===id)}
function branchAgeText(id){const b=branchById(id);if(!b)return'';return b.maxAge>=99?`${b.minAge} años en adelante`:`${b.minAge} a ${b.maxAge} años`}
function ageMatchesBranch(birthdate,branchId){const b=branchById(branchId),age=ageOf(birthdate);return!birthdate||!b||age===''||(age>=Number(b.minAge)&&age<=Number(b.maxAge))}
function refereeById(id){return db.referees.find(r=>r.id===id)}
function scheduleById(id){return db.schedules.find(e=>e.id===id)}
function teamBranch(t){return participantById((t?.members||[])[0])?.branch||''}

function saveBranchConfig(e){e.preventDefault();const original=$('branchOriginal').value,id=$('branchId').value.trim().toLowerCase().replace(/\s+/g,'-'),data={id,name:$('branchName').value.trim(),minAge:Number($('branchMin').value),maxAge:Number($('branchMax').value),description:$('branchDescription').value.trim(),active:$('branchActive').checked};if(data.maxAge<data.minAge)return toast('La edad máxima no puede ser menor que la mínima.','error');if(db.branches.some(b=>b.id===id&&b.id!==original))return toast('Ese identificador ya existe.','error');if(original){Object.assign(branchById(original),data);db.participants.forEach(p=>{if(p.branch===original)p.branch=id});db.sports.forEach(s=>s.branches=s.branches.map(x=>x===original?id:x));audit('Actualizó rama '+data.name)}else{db.branches.push(data);audit('Creó rama '+data.name)}saveDB();renderApp();toast('Rama guardada.','success')}

function saveParticipant(e){e.preventDefault();const id=$('participantId').value,first=$('participantFirst').value.trim(),last=$('participantLast').value.trim(),data={groupId:$('participantGroup').value,docType:$('participantDocType').value,document:$('participantDoc').value.trim(),firstNames:first,lastNames:last,name:`${first} ${last}`.trim(),birthdate:$('participantBirth').value,branch:$('participantBranch').value,gender:$('participantGender').value,phone:$('participantPhone').value.trim(),email:$('participantEmail').value.trim(),notes:$('participantNotes').value.trim(),active:$('participantActive').checked};if(db.participants.some(p=>p.document===data.document&&p.id!==id))return toast('Ese documento ya está registrado.','error');if(!ageMatchesBranch(data.birthdate,data.branch)&&!confirm(`La edad calculada no coincide con ${branchName(data.branch)} (${branchAgeText(data.branch)}). ¿Guardar de todas formas?`))return;if(id){Object.assign(participantById(id),data);audit('Actualizó participante '+data.name)}else{db.participants.push({id:uid('p'),...data});audit('Registró participante '+data.name)}saveDB();clearParticipantForm();renderParticipantsTable();toast('Participante guardado.','success')}

function validateImport(rows){const errors=[],valid=[];rows.forEach(r=>{const e=[],g=db.groups.find(x=>x.code===r.CODIGO_GRUPO),branch=(r.RAMA||'').toLowerCase(),status=(r.ESTADO||'ACTIVO').toUpperCase();if(!g)e.push('Código de grupo inexistente');if(!r.NUMERO_DOCUMENTO)e.push('Documento vacío');if(db.participants.some(p=>p.document===r.NUMERO_DOCUMENTO)||valid.some(v=>v.document===r.NUMERO_DOCUMENTO))e.push('Documento duplicado');if(!r.NOMBRES||!r.APELLIDOS)e.push('Nombre incompleto');if(!db.branches.some(b=>b.id===branch))e.push('Rama no reconocida');if(!['ACTIVO','INACTIVO'].includes(status))e.push('Estado inválido');if(r.FECHA_NACIMIENTO&&db.branches.some(b=>b.id===branch)&&!ageMatchesBranch(r.FECHA_NACIMIENTO,branch))e.push(`La edad no corresponde a ${branchName(branch)}`);const data={id:uid('p'),groupId:g?.id||'',docType:r.TIPO_DOCUMENTO||'TI',document:r.NUMERO_DOCUMENTO,firstNames:r.NOMBRES,lastNames:r.APELLIDOS,name:`${r.NOMBRES||''} ${r.APELLIDOS||''}`.trim(),birthdate:r.FECHA_NACIMIENTO||'',branch,gender:r.GENERO||'',phone:r.TELEFONO||'',email:r.CORREO||'',active:status==='ACTIVO',notes:r.OBSERVACIONES||'',_row:r._row};if(e.length)errors.push({...data,errors:e});else valid.push(data)});return{valid,errors}}

function adminSchedule(){const sportOpts=db.sports.filter(s=>s.active).map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join(''),refOpts=db.referees.filter(r=>r.active).map(r=>`<option value="${r.id}">${esc(r.name)}</option>`).join('');setPage(`<div class="page-head"><div><h2>Programación de competencias</h2><p>Genera partidos todos contra todos o divide las inscripciones individuales en sesiones.</p></div><button class="btn btn-secondary" onclick="openManualSchedule()">＋ Crear competencia manual</button></div><div class="split"><div class="panel"><span class="kicker">Asistente rápido</span><h3>Generar programación</h3><form id="scheduleGenerator"><div class="field"><label>1. Deporte *</label><select id="scheduleSport" required><option value="">Seleccionar</option>${sportOpts}</select></div><div class="field"><label>2. Rama *</label><select id="scheduleBranch" required><option value="">Primero selecciona un deporte</option></select></div><div class="row"><div class="field"><label>3. Fecha inicial *</label><input id="scheduleDate" type="date" value="${new Date().toISOString().slice(0,10)}" required></div><div class="field"><label>Hora inicial *</label><input id="scheduleTime" type="time" value="08:00" required></div></div><div class="row"><div class="field"><label>Intervalo en minutos</label><input id="scheduleInterval" type="number" min="5" value="45"></div><div class="field"><label>Lugar o cancha</label><input id="scheduleVenue" value="Cancha principal"></div></div><div class="field"><label>4. Árbitro</label><select id="scheduleReferee"><option value="">Sin asignar</option>${refOpts}</select></div><label class="checkline"><input type="checkbox" id="scheduleIncludePending"> Incluir inscripciones completas todavía no confirmadas</label><button class="btn btn-primary btn-block">Generar automáticamente</button></form><div class="alert info" style="margin-top:14px">Los deportes grupales se organizan en partidos todos contra todos. Los individuales se dividen en function generateSchedule(e){e.preventDefault();const sportId=$('scheduleSport').value,branchId=$('scheduleBranch').value,s=sportById(sportId),date=$('scheduleDate').value,time=$('scheduleTime').value,interval=Number($('scheduleInterval').value||45),venue=$('scheduleVenue').value.trim(),refereeId=$('scheduleReferee').value,includePending=$('scheduleIncludePending').checked;if(!s||!branchId)return toast('Selecciona deporte y rama.','error');const existing=db.schedules.filter(x=>x.sportId===sportId&&x.branchId===branchId);if(existing.length&&!confirm(`Ya existen ${existing.length} competencias para esta categoría. ¿Reemplazarlas?`))return;let generated=[];if(s.type==='group'){const teams=eligibleTeamsForSchedule(sportId,branchId,includePending);if(teams.length<2)return toast('Se necesitan al menos dos equipos completos para generar partidos.','error');let index=0;for(let i=0;i<teams.length;i++)for(let j=i+1;j<teams.length;j++){const dt=addMinutes(date,time,index*interval);generated.push({id:uid('sch'),sportId,branchId,type:'match',label:`Partido ${index+1}`,date:dt.date,time:dt.time,venue,refereeId,teamAId:teams[i].id,teamBId:teams[j].id,participantIds:[],status:'scheduled',result:null,resultPublished:false,createdAt:new Date().toISOString()});index++}}else{const ids=eligibleParticipantsForSchedule(sportId,branchId,includePending);if(!ids.length)return toast('No hay participantes elegibles para generar sesiones.','error');const cap=Math.max(1,Number(s.sessionCapacity||8));for(let i=0;i<ids.length;i+=cap){const index=Math.floor(i/cap),dt=addMinutes(date,time,index*interval);generated.push({id:uid('sch'),sportId,branchId,type:'session',label:`Sesión ${index+1}`,date:dt.date,time:dt.time,venue,refereeId,teamAId:'',teamBId:'',participantIds:ids.slice(i,i+cap),status:'scheduled',result:null,resultPublished:false,createdAt:new Date().toISOString()})}}db.schedules=db.schedules.filter(x=>!(x.sportId===sportId&&x.branchId===branchId));db.schedules.push(...generated);audit(`Generó ${generated.length} competencias de ${s.name} · ${branchName(branchId)}`);saveDB();renderApp();toast(`${generated.length} competencias generadas.`, 'success')}
function renderAdminScheduleList(){const q=($('scheduleSearch')?.value||'').toLowerCase(),f=$('scheduleStatusFilter')?.value||'',items=[...db.schedules].sort((a,b)=>competitionDate(a)-competitionDate(b)).filter(e=>(!f||e.status===f)&&[sportById(e.sportId)?.name,branchName(e.branchId),scheduleTitle(e),e.venue,refereeById(e.refereeId)?.name].join(' ').toLowerCase().includes(q));$('scheduleAdminList').innerHTML=items.length?`<div class="table-wrap"><table><thead><tr><th>Competencia</th><th>Fecha y lugar</th><th>Árbitro</th><th>Estado</th><th>Resultado</th><th>Acciones</th></tr></thead><tbody>${items.map(e=>`<tr><td><b>${esc(sportById(e.sportId)?.name||'')}</b><br>${esc(scheduleTitle(e))}<br><small>${esc(branchName(e.branchId))}</small></td><td>${fmtDate(e.date)} · ${esc(e.time||'')}<br><small>${esc(e.venue||'Sin lugar')}</small></td><td>${esc(refereeById(e.refereeId)?.name||'Sin asignar')}</td><td>${statusBadge(e.status)}${e.resultPublished?'<br><span class="badge green">Publicado</span>':''}</td><td>${eventResultSummary(e)}</td><td><div class="actions"><button class="btn btn-sm btn-primary" onclick="openResultEntry('${e.id}')">Resultado</button><button class="btn btn-sm btn-secondary" onclick="editSchedule('${e.id}')">Editar</button><button class="btn btn-sm btn-danger" onclick="deleteSchedule('${e.id}')">Eliminar</button></div></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty"><span class="big">🗓️</span>No hay competencias programadas.</div>'}
